// ── State ──────────────────────────────────────────────────────────────────
let activeCat = 'all';
let activeUC = 'all';
let activePipeline = null;
let searchQuery = '';

// ── Helpers ────────────────────────────────────────────────────────────────
function makeEl(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// ── Clock ──────────────────────────────────────────────────────────────────
function updateClock() {
  const d = new Date(), p = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
setInterval(updateClock, 1000);
updateClock();

// ── Filter ────────────────────────────────────────────────────────────────
function normalize(str) {
  return str.toLowerCase().replace(/(?<=[א-ת])א(?=[א-ת])/g,'');
}
function matchesQuery(s, q) {
  if (!q) return true;
  const nq = normalize(q);
  const fields = [s.cmd, s.desc, s.detail||'', ...(s.triggers||[]), ...(s.next||[]).map(n=>n.label+' '+n.hint)];
  return fields.some(f => normalize(f).includes(nq));
}

function getFiltered() {
  if (activePipeline) {
    return activePipeline.skills
      .map(ps => DEFAULT_SKILLS.find(s => s.cmd === ps.cmd))
      .filter(s => s && matchesQuery(s, searchQuery));
  }
  return DEFAULT_SKILLS.filter(s => {
    const mc = activeCat === 'all' || s.cat === activeCat;
    const mu = activeUC === 'all' || (s.uc && s.uc.includes(activeUC));
    return mc && mu && matchesQuery(s, searchQuery);
  });
}

// ── Sidebar ────────────────────────────────────────────────────────────────
function renderSidebar() {
  // Category list
  const cl = document.getElementById('cat-list');
  cl.textContent = '';

  const allItem = makeEl('div', 'category-item' + (activeCat === 'all' ? ' active' : ''));
  const allLeft = makeEl('div', 'cat-left');
  const allDot = makeEl('span', 'category-dot');
  allDot.style.background = '#445';
  allLeft.appendChild(allDot);
  const allLabel = makeEl('span', 'cat-name', 'הכל');
  allLeft.appendChild(allLabel);
  allItem.appendChild(allLeft);
  const allCount = makeEl('span', 'cat-count');
  allCount.textContent = String(DEFAULT_SKILLS.length);
  allItem.appendChild(allCount);
  allItem.addEventListener('click', () => setCategory('all'));
  cl.appendChild(allItem);

  CAT_ORDER.forEach(cat => {
    const count = DEFAULT_SKILLS.filter(s => s.cat === cat).length;
    const item = makeEl('div', 'category-item' + (activeCat === cat ? ' active' : ''));
    const left = makeEl('div', 'cat-left');
    const dot = makeEl('span', 'category-dot');
    dot.style.background = CAT_COLORS[cat] || '#888';
    left.appendChild(dot);
    left.appendChild(makeEl('span', 'cat-name', CAT_LABELS[cat] || cat));
    item.appendChild(left);
    item.appendChild(makeEl('span', 'cat-count', String(count)));
    item.addEventListener('click', () => setCategory(cat));
    cl.appendChild(item);
  });

  // UC list
  const ul = document.getElementById('uc-list');
  ul.textContent = '';

  const allUC = makeEl('div', 'uc-item' + (activeUC === 'all' ? ' active' : ''));
  allUC.textContent = 'הכל';
  allUC.addEventListener('click', () => setUC('all'));
  ul.appendChild(allUC);

  UC_ORDER.forEach(uc => {
    const item = makeEl('div', 'uc-item' + (activeUC === uc ? ' active' : ''));
    item.textContent = UC_LABELS[uc] || uc;
    item.addEventListener('click', () => setUC(uc));
    ul.appendChild(item);
  });

  // Stats
  const mcpCount = DEFAULT_SKILLS.filter(s => s.cat === 'mcp').length;
  document.getElementById('stat-mcp').textContent = String(mcpCount);
  document.getElementById('stat-pipelines').textContent = String(PIPELINES.length);

  // Status bar
  document.getElementById('status-stats').textContent = DEFAULT_SKILLS.length + ' סקילים · ' + PIPELINES.length + ' פייפליינים';
}

function setCategory(cat) {
  activeCat = cat;
  activePipeline = null;
  document.querySelectorAll('.pipeline-card').forEach(c => c.classList.remove('active'));
  renderSidebar();
  renderGrid();
}

function setUC(uc) {
  activeUC = uc;
  activePipeline = null;
  document.querySelectorAll('.pipeline-card').forEach(c => c.classList.remove('active'));
  renderSidebar();
  renderGrid();
}

// ── Pipelines ─────────────────────────────────────────────────────────────
function initPipelines() {
  const row = document.getElementById('pipeline-row');
  Object.entries(PIPELINE_GROUPS).forEach(([gid, g]) => {
    const grp = makeEl('div', 'pipeline-group');
    const hdr = makeEl('div', 'pipeline-group-header');
    const em = makeEl('span', 'pipeline-group-emoji', g.emoji);
    const lbl = makeEl('span', 'pipeline-group-label', g.label);
    const dsc = makeEl('span', 'pipeline-group-desc', ' — ' + g.desc);
    hdr.appendChild(em); hdr.appendChild(lbl); hdr.appendChild(dsc);
    grp.appendChild(hdr);

    const cards = makeEl('div', 'pipeline-cards-row');
    PIPELINES.filter(p => p.group === gid).forEach(p => {
      const card = makeEl('div', 'pipeline-card');
      card.dataset.id = p.id;
      card.appendChild(makeEl('div', 'pipeline-emoji', p.emoji));
      card.appendChild(makeEl('div', 'pipeline-name', p.name));
      card.appendChild(makeEl('div', 'pipeline-desc', p.desc));
      const totalSteps = p.sessions ? p.sessions.reduce((a,s) => a+s.skills.length, 0) : p.skills.length;
      card.appendChild(makeEl('div', 'pipeline-count', totalSteps + ' שלבים'));
      card.addEventListener('click', () => {
        if (activePipeline && activePipeline.id === p.id) {
          clearPipeline(); return;
        }
        activePipeline = p;
        document.querySelectorAll('.pipeline-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        const titleEl = document.getElementById('skills-title');
        titleEl.textContent = p.emoji + ' ' + p.name;
        renderGrid();
      });
      cards.appendChild(card);
    });
    grp.appendChild(cards);
    row.appendChild(grp);
  });
}

function clearPipeline() {
  activePipeline = null;
  document.querySelectorAll('.pipeline-card').forEach(c => c.classList.remove('active'));
  document.getElementById('skills-title').textContent = 'כל הסקילים';
  renderGrid();
}

// ── Grid ──────────────────────────────────────────────────────────────────
function buildSkillCard(s, stepNum, stepLabel, pipelineSkill) {
  const color = CAT_COLORS[s.cat] || '#555';
  const card = makeEl('div', 'skill-card');

  if (stepNum) {
    card.appendChild(makeEl('div', 'step-num-badge', 'שלב ' + stepNum + (stepLabel ? ' · ' + stepLabel : '')));
  }

  const top = makeEl('div', 'card-top');
  const cmdEl = makeEl('span', 'card-cmd', s.cmd);
  top.appendChild(cmdEl);
  const catEl = makeEl('span', 'card-cat');
  const dot = makeEl('span', 'card-cat-dot');
  dot.style.background = color;
  const catLabel = makeEl('span');
  catLabel.textContent = CAT_LABELS[s.cat] || s.cat;
  catLabel.style.color = color;
  catEl.appendChild(dot);
  catEl.appendChild(catLabel);
  top.appendChild(catEl);
  card.appendChild(top);

  card.appendChild(makeEl('div', 'card-desc', s.desc));

  if (pipelineSkill && pipelineSkill.context) {
    card.appendChild(makeEl('div', 'card-context-short', pipelineSkill.context.short));
  }

  const bottom = makeEl('div', 'card-bottom');
  const isSlash = s.cmd.startsWith('/');
  const isMCP = s.cmd.startsWith('MCP ·');
  let typeText = isMCP ? '🔌 MCP' : isSlash ? '/ slash' : '⚡ אוטומטי';
  bottom.appendChild(makeEl('span', 'type-badge', typeText));
  bottom.appendChild(makeEl('span', 'detail-link', 'לפרטים ←'));
  card.appendChild(bottom);

  card.addEventListener('click', () => openDetail(s, pipelineSkill));
  return card;
}

function renderGrid() {
  const filtered = getFiltered();
  const countBadge = document.getElementById('count-badge');
  countBadge.textContent = String(filtered.length);
  const area = document.getElementById('grid-area');
  while (area.firstChild) area.removeChild(area.firstChild);

  // Title
  if (!activePipeline) {
    const titleEl = document.getElementById('skills-title');
    if (activeCat !== 'all') {
      titleEl.textContent = CAT_LABELS[activeCat] || activeCat;
    } else if (activeUC !== 'all') {
      titleEl.textContent = UC_LABELS[activeUC] || activeUC;
    } else {
      titleEl.textContent = 'כל הסקילים';
    }
  }

  if (!filtered.length) {
    const e = makeEl('div', 'empty', 'לא נמצאו סקילים · try a different search');
    area.appendChild(e);
    return;
  }

  if (activePipeline) {
    const banner = makeEl('div', 'pipeline-banner');
    const bname = makeEl('span', 'pipeline-banner-name', activePipeline.emoji + ' ' + activePipeline.name + ' — ' + activePipeline.desc);
    const bclear = makeEl('button', 'pipeline-banner-clear', '× נקה');
    bclear.addEventListener('click', clearPipeline);
    banner.appendChild(bname); banner.appendChild(bclear);
    area.appendChild(banner);

    if (activePipeline.sessions) {
      activePipeline.sessions.forEach(session => {
        const hdr = makeEl('div', 'session-header', session.name);
        area.appendChild(hdr);
        const grid = makeEl('div', 'cards-grid');
        session.skills.forEach((ps, i) => {
          const s = DEFAULT_SKILLS.find(x => x.cmd === ps.cmd);
          if (s) grid.appendChild(buildSkillCard(s, i+1, ps.stepLabel, ps));
        });
        area.appendChild(grid);
      });
    } else {
      const grid = makeEl('div', 'cards-grid');
      filtered.forEach((s, i) => {
        const ps = activePipeline.skills.find(p => p.cmd === s.cmd);
        grid.appendChild(buildSkillCard(s, i+1, ps ? ps.stepLabel : '', ps));
      });
      area.appendChild(grid);
    }
  } else {
    // Group by category
    const groups = {};
    filtered.forEach(s => { if (!groups[s.cat]) groups[s.cat] = []; groups[s.cat].push(s); });
    CAT_ORDER.forEach(cat => {
      if (!groups[cat]) return;
      const lbl = makeEl('div', 'grid-section-label', CAT_LABELS[cat] || cat);
      area.appendChild(lbl);
      const grid = makeEl('div', 'cards-grid');
      groups[cat].forEach(s => grid.appendChild(buildSkillCard(s)));
      area.appendChild(grid);
    });
  }
}

// ── Detail Panel ──────────────────────────────────────────────────────────
function openDetail(s, pipelineSkill) {
  const panel = document.getElementById('detail-panel');
  const inner = document.getElementById('detail-inner');
  inner.textContent = '';

  const color = CAT_COLORS[s.cat] || '#888';

  // Header: cmd + cat badge + close
  const header = makeEl('div', 'detail-header');
  const hLeft = makeEl('div', 'detail-cmd-block');
  hLeft.appendChild(makeEl('div', 'detail-cmd', s.cmd));
  const badge = makeEl('div', 'detail-cat-badge');
  badge.style.background = color + '22';
  badge.style.color = color;
  const bdot = makeEl('span');
  Object.assign(bdot.style, { width:'6px', height:'6px', borderRadius:'50%', background:color, display:'inline-block', marginLeft:'5px' });
  badge.appendChild(bdot);
  badge.appendChild(document.createTextNode(CAT_LABELS[s.cat] || s.cat));
  hLeft.appendChild(badge);
  header.appendChild(hLeft);
  const closeBtn = makeEl('button', 'detail-close', '×');
  closeBtn.addEventListener('click', closeDetail);
  header.appendChild(closeBtn);
  inner.appendChild(header);

  inner.appendChild(makeEl('div', 'detail-divider'));

  // Short desc
  inner.appendChild(makeEl('div', 'detail-desc', s.desc));

  // Pipeline context
  if (pipelineSkill && pipelineSkill.context) {
    const ctx = pipelineSkill.context;
    const ctxSec = makeEl('div', 'pipeline-detail-section');

    const wlbl = makeEl('div', 'ps-what-label', 'מה לכתוב ל-Claude');
    const write = makeEl('div', 'ps-write', ctx.howto);
    ctxSec.appendChild(wlbl); ctxSec.appendChild(write);

    const glbl = makeEl('div', 'ps-what-label', 'מה מקבלים');
    ctxSec.appendChild(glbl);
    ctxSec.appendChild(makeEl('div', 'ps-text', ctx.what));
    inner.appendChild(ctxSec);
    inner.appendChild(makeEl('div', 'detail-divider'));
  }

  // Detail text
  if (s.detail) {
    const sec = makeEl('div', 'detail-section');
    sec.appendChild(makeEl('div', 'detail-section-label', 'מה זה עושה בפועל'));
    sec.appendChild(makeEl('div', 'detail-text', s.detail));
    inner.appendChild(sec);
  }


  // Workflow timeline (all non-MCP skills)
  if (!s.cmd.startsWith('MCP ·')) {
    const isNatural = !s.cmd.startsWith('/');
    const invoke = isNatural ? (s.usage || (s.triggers && s.triggers[0]) || s.cmd) : s.cmd;
    const tlSec = makeEl('div', 'detail-section');
    tlSec.appendChild(makeEl('div', 'detail-section-label', isNatural ? 'הפעלה טבעית — ללא /' : 'פקודה להפעלה'));

    // Step ①: command to type
    const tl = makeEl('div', 'skill-timeline');

    const step1 = makeEl('div', 'tl-step');
    const d1 = makeEl('div', 'tl-dot');
    const b1 = makeEl('div', 'tl-body');
    b1.appendChild(makeEl('div', 'tl-step-num', isNatural ? '① אמור ל-Claude' : '① הקלד'));
    const cmdClickable = makeEl('div', 'tl-cmd-block', invoke);
    cmdClickable.addEventListener('click', () => copyText(invoke));
    cmdClickable.title = 'לחץ להעתקה';
    b1.appendChild(cmdClickable);
    step1.appendChild(d1); step1.appendChild(b1);
    tl.appendChild(step1);

    // Step ②: what to write — use steps[1] (the actual input example, not the command itself)
    const writeHint = (pipelineSkill && pipelineSkill.context && pipelineSkill.context.howto)
      || (s.steps && s.steps[1] && s.steps[1].t)
      || (s.steps && s.steps[0] && s.steps[0].t)
      || 'תאר את הבעיה או הבקשה שלך בשפה טבעית';
    const writeExample = (s.steps && s.steps[1] && s.steps[1].c) || null;
    const step2 = makeEl('div', 'tl-step');
    const d2 = makeEl('div', 'tl-dot dim');
    const b2 = makeEl('div', 'tl-body');
    b2.appendChild(makeEl('div', 'tl-step-num', '② מה לכתוב ל-Claude'));
    b2.appendChild(makeEl('div', 'tl-hint', writeHint));
    if (writeExample) b2.appendChild(makeEl('div', 'tl-cmd-block', writeExample));
    step2.appendChild(d2); step2.appendChild(b2);
    tl.appendChild(step2);

    // Step ③: what you get
    const getsHint = (pipelineSkill && pipelineSkill.context && pipelineSkill.context.what)
      || s.desc || '';
    const step3 = makeEl('div', 'tl-step');
    const d3 = makeEl('div', 'tl-dot dim');
    const b3 = makeEl('div', 'tl-body');
    b3.appendChild(makeEl('div', 'tl-step-num', '③ מה מקבלים'));
    b3.appendChild(makeEl('div', 'tl-gets', getsHint));
    step3.appendChild(d3); step3.appendChild(b3);
    tl.appendChild(step3);

    tlSec.appendChild(tl);

    // Copy button
    const copyBlock = makeEl('div', 'copy-block');
    copyBlock.appendChild(makeEl('span', 'copy-cmd', invoke));
    const copyBtn = makeEl('button', 'copy-btn', '📋 העתק');
    copyBtn.addEventListener('click', () => copyText(invoke));
    copyBlock.appendChild(copyBtn);
    tlSec.appendChild(copyBlock);

    inner.appendChild(tlSec);
  } else {
    inner.appendChild(makeEl('div', 'mcp-note', 'מופעל אוטומטית בשיחה — אין צורך בפקודה'));
  }

  // Next steps
  if (s.next && s.next.length > 0) {
    const nsec = makeEl('div', 'next-section');
    nsec.appendChild(makeEl('div', 'next-section-label', 'מה עושים עם התוצאה'));
    s.next.forEach(n => {
      const btn = makeEl('button', 'next-btn');
      const em = makeEl('span', 'next-btn-emoji', n.emoji);
      const info = document.createElement('div');
      info.style.flex = '1';
      const lbl = makeEl('div', 'next-btn-label', n.label);
      const hint = makeEl('div', 'next-btn-hint', n.hint);
      const tag = makeEl('span', 'next-btn-copy', 'העתק + סגור');
      info.appendChild(lbl); info.appendChild(hint);
      btn.appendChild(em); btn.appendChild(info); btn.appendChild(tag);
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(n.prompt).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = n.prompt;
          document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        });
        closeDetail();
        const t = document.getElementById('toast');
        t.textContent = 'הועתק — הדבק ב-Claude Code ✓';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
      });
      nsec.appendChild(btn);
    });
    inner.appendChild(nsec);
  }

  // Triggers
  if (s.triggers && s.triggers.length > 0) {
    const tsec = makeEl('div', 'triggers-section');
    tsec.appendChild(makeEl('div', 'triggers-label', 'טריגרים'));
    const tlist = makeEl('div', 'triggers-list');
    s.triggers.forEach(tr => {
      const chip = makeEl('span', 'trigger-chip' + (tr === 'פקודה ידנית' ? ' manual' : ''), tr);
      tlist.appendChild(chip);
    });
    tsec.appendChild(tlist);
    inner.appendChild(tsec);
  }

  panel.classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
}

// ── Copy ──────────────────────────────────────────────────────────────────
function copyText(text) {
  navigator.clipboard.writeText(text).then(() => {
    const t = document.getElementById('toast');
    t.textContent = 'הועתק ✓';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    const t = document.getElementById('toast');
    t.textContent = 'הועתק ✓';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  });
}

// ── Search ────────────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderGrid();
});

// Escape closes detail
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

// Brand logo → reset to default
document.getElementById('brand-logo').addEventListener('click', () => {
  activeCat = 'all';
  activeUC = 'all';
  activePipeline = null;
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  closeDetail();
  renderSidebar();
  renderGrid();
});

// ── Init ──────────────────────────────────────────────────────────────────
renderSidebar();
initPipelines();
renderGrid();
</script>
</body>
</html>
