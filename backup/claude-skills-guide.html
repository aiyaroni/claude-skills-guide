<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="מדריך אינטראקטיבי לסקילים של Claude Code — פייפליינים, פקודות, ו-MCP servers">
<meta name="theme-color" content="#080c12">
<title>Claude Skills Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Heebo:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c12;
    --surface: #0d1520;
    --surface-hover: #111d2e;
    --border: #162030;
    --text: #e8e8e8;
    --text-body: #c8c8c8;
    --text-dim: #9ca3af;
    --lime: #C5F206;
    --lime-dim: rgba(197,242,6,0.1);
    --fuchsia: #f72585;
    --cat-post: #e879f9;
    --cat-agency: #60a5fa;
    --cat-dev: #34d399;
    --cat-docs: #fbbf24;
    --cat-build: #a78bfa;
    --cat-automation: #fb923c;
    --cat-telegram: #38bdf8;
    --cat-hookify: #f87171;
    --cat-plugins: #4ade80;
    --cat-mcp: #06b6d4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    font-size: 14px;
    height: 100%;
    overflow: hidden;
    direction: rtl;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(197,242,6,0.3); }

  /* ── STATUS BAR ── */
  .status-bar {
    height: 40px;
    background: #060a10;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    flex-shrink: 0;
    position: relative;
    z-index: 50;
  }
  .status-bar .brand {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }
  .status-bar .stats { font-size: 12px; color: var(--text-dim); }
  .status-bar .clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--lime);
  }

  /* ── APP SHELL ── */
  .app { display: flex; height: calc(100vh - 40px); overflow: hidden; }

  /* ── SIDEBAR — RIGHT (order:0) ── */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    order: 0;
  }

  .sidebar-logo {
    padding: 20px 16px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo .studio-name {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--lime);
    letter-spacing: 0.08em;
  }
  .sidebar-logo .tagline {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 3px;
    font-family: 'Heebo', sans-serif;
  }

  .sidebar-search { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .sidebar-search input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .sidebar-search input::placeholder { color: var(--text-dim); }
  .sidebar-search input:focus { border-color: var(--lime); }

  .sidebar-section { padding: 12px 16px 8px; }
  .sidebar-section-header {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--lime);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .category-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 2px;
  }
  .category-item:hover, .category-item.active { background: var(--surface-hover); }
  .cat-left { display: flex; align-items: center; gap: 8px; }
  .category-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .cat-name { font-size: 13px; color: var(--text-body); font-family: 'Heebo', sans-serif; }
  .cat-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    background: var(--border);
    border-radius: 10px;
    padding: 1px 6px;
  }

  .uc-section { padding: 4px 16px 8px; border-top: 1px solid var(--border); }
  .uc-section-header {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--lime);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 6px;
    padding-top: 8px;
  }
  .uc-item {
    display: flex;
    align-items: center;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 2px;
    font-size: 13px;
    color: var(--text-body);
    font-family: 'Heebo', sans-serif;
  }
  .uc-item:hover { background: var(--surface-hover); }
  .uc-item.active { background: rgba(197,242,6,0.08); color: var(--lime); }

  /* Sidebar stats — NO skills count */
  .sidebar-stats {
    margin-top: auto;
    padding: 16px;
    border-top: 1px solid var(--border);
  }
  .stat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 0;
  }
  .stat-label { font-size: 12px; color: var(--text-dim); font-family: 'Heebo', sans-serif; }
  .stat-val { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text); }

  /* ── MAIN — CENTER (order:1) ── */
  .main { flex: 1; overflow-y: auto; padding: 24px; order: 1; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .section-header h2 {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }
  .count-badge {
    background: var(--lime);
    color: #000;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
  }

  /* Pipelines section */
  .pipeline-section { margin-bottom: 20px; }
  .pipeline-section-label {
    font-family: 'Heebo', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 10px;
    direction: rtl;
    text-align: right;
  }
  .pipeline-group { margin-bottom: 14px; }
  .pipeline-group-header {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin-bottom: 8px;
    direction: rtl;
    text-align: right;
    padding: 0 4px;
  }
  .pipeline-group-emoji { font-size: 14px; }
  .pipeline-group-label { color: var(--lime); font-size: 12px; font-family: 'Syne', sans-serif; }
  .pipeline-group-desc { color: #444; font-size: 10px; font-family: 'Heebo', sans-serif; font-weight: 400; }
  .pipeline-cards-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .pipeline-card {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    gap: 3px;
    width: 185px;
    direction: rtl;
    text-align: right;
  }
  .pipeline-card:hover { border-color: rgba(197,242,6,0.3); background: var(--surface-hover); transform: translateY(-1px); }
  .pipeline-card.active { border-color: var(--lime); background: rgba(197,242,6,0.06); box-shadow: 0 0 0 1px rgba(197,242,6,0.2); }
  .pipeline-emoji { font-size: 18px; line-height: 1; }
  .pipeline-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px; color: var(--text); margin-top: 2px; }
  .pipeline-desc { font-size: 12px; color: var(--text-body); font-family: 'Heebo', sans-serif; line-height: 1.4; }
  .pipeline-count { font-family: 'Heebo', sans-serif; font-size: 11px; font-weight: 600; color: var(--lime); margin-top: 3px; }

  /* Pipeline banner */
  .pipeline-banner {
    background: rgba(197,242,6,0.04);
    border: 1px solid rgba(197,242,6,0.15);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    direction: rtl;
  }
  .pipeline-banner-name { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; color: var(--text); flex: 1; }
  .pipeline-banner-clear {
    background: none;
    border: 1px solid rgba(197,242,6,0.25);
    color: var(--lime);
    border-radius: 5px;
    padding: 3px 10px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Heebo', sans-serif;
    font-weight: 600;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .pipeline-banner-clear:hover { background: rgba(197,242,6,0.08); }

  /* Session header in pipeline */
  .session-header {
    color: var(--lime);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin: 24px 0 10px;
    padding: 8px 14px;
    background: rgba(197,242,6,0.05);
    border-radius: 6px;
    border-right: 3px solid var(--lime);
    font-family: 'JetBrains Mono', monospace;
  }

  /* Divider between pipelines and skills */
  .section-divider { height: 1px; background: var(--border); margin: 0 0 20px; }

  /* ── SKILL CARDS ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 12px;
  }
  .skill-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .skill-card:hover { border-color: rgba(197,242,6,0.3); background: var(--surface-hover); transform: translateY(-1px); }

  .step-num-badge {
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--lime);
    background: rgba(197,242,6,0.08);
    border: 1px solid rgba(197,242,6,0.2);
    border-radius: 4px;
    padding: 3px 10px;
    display: inline-block;
    direction: rtl;
    text-align: right;
    white-space: nowrap;
  }

  .card-top { display: flex; align-items: center; justify-content: space-between; }
  .card-cmd { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text); }
  .card-cat { display: flex; align-items: center; gap: 5px; font-size: 11px; }
  .card-cat-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .card-desc {
    font-size: 13px;
    color: var(--text-body);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-family: 'Heebo', sans-serif;
  }
  .card-context-short {
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    color: var(--lime);
    background: rgba(197,242,6,0.05);
    border-right: 2px solid rgba(197,242,6,0.4);
    padding: 5px 10px;
    border-radius: 4px;
    direction: rtl;
    font-style: italic;
  }
  .card-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
  .type-badge {
    font-size: 11px;
    color: var(--text-dim);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    font-family: 'JetBrains Mono', monospace;
  }
  .detail-link { font-size: 12px; color: var(--text-dim); font-family: 'Heebo', sans-serif; }

  /* Empty state */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: #444;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.5px;
  }

  /* Section label in grid */
  .grid-section-label {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--lime);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
    margin-top: 24px;
  }
  .grid-section-label:first-child { margin-top: 0; }

  /* ── DETAIL PANEL — LEFT (order:2) ── */
  .detail-panel {
    width: 0;
    overflow: hidden;
    transition: width 0.28s cubic-bezier(0.4,0,0.2,1);
    background: var(--surface);
    border-right: 1px solid var(--border);
    flex-shrink: 0;
    order: 2;
  }
  .detail-panel.open { width: 480px; overflow: visible; }
  .detail-inner {
    width: 100%;
    max-width: 480px;
    padding: 24px;
    overflow-y: auto;
    overflow-x: hidden;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
    box-sizing: border-box;
  }

  .detail-header { display: flex; align-items: flex-start; justify-content: space-between; }
  .detail-cmd-block { flex: 1; }
  .detail-cmd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    word-break: break-all;
  }
  .detail-cat-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    border-radius: 4px;
    padding: 3px 8px;
    margin-top: 6px;
    font-family: 'Heebo', sans-serif;
  }
  .detail-close {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    margin-right: 8px;
  }
  .detail-close:hover { border-color: var(--fuchsia); color: var(--fuchsia); }

  .detail-divider { height: 1px; background: var(--border); }

  .detail-desc {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.6;
    direction: rtl;
    text-align: right;
    font-family: 'Heebo', sans-serif;
    word-break: break-word;
    overflow-wrap: break-word;
  }

  .detail-section { display: flex; flex-direction: column; gap: 8px; }
  .detail-section-label {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--lime);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .detail-text {
    font-size: 14px;
    color: var(--text-body);
    line-height: 1.75;
    direction: rtl;
    text-align: right;
    font-family: 'Heebo', sans-serif;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: break-word;
    max-width: 100%;
  }

  /* Steps box */
  .steps-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    direction: rtl;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .steps-box-label {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--lime);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .step-row { display: flex; gap: 10px; direction: rtl; }
  .step-num { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--lime); flex-shrink: 0; margin-top: 2px; }
  .step-content { flex: 1; }
  .step-text { font-size: 14px; color: var(--text-body); line-height: 1.5; font-family: 'Heebo', sans-serif; text-align: right; word-break: break-word; overflow-wrap: break-word; }
  .step-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text);
    background: rgba(197,242,6,0.04);
    border: 1px solid rgba(197,242,6,0.15);
    border-radius: 4px;
    padding: 6px 10px;
    display: block;
    margin-top: 4px;
    direction: ltr;
    white-space: pre-wrap;
    line-height: 1.6;
    word-break: break-all;
    max-width: 100%;
    overflow-x: hidden;
  }

  /* Copy block */
  /* Skill timeline */
  .skill-timeline { margin-bottom: 14px; }
  .tl-step { display: flex; gap: 10px; margin-bottom: 16px; position: relative; }
  .tl-step:not(:last-child)::after {
    content: '';
    position: absolute;
    right: 7px; top: 18px; bottom: -6px;
    width: 1px; background: var(--border);
  }
  .tl-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--border); border: 2px solid var(--text-dim); flex-shrink: 0; margin-top: 2px; }
  .tl-dot.dim { background: var(--border); border: 2px solid var(--text-dim); }
  .tl-body { flex: 1; min-width: 0; overflow: hidden; }
  .tl-step-num { font-family: 'Heebo', sans-serif; font-size: 11px; color: var(--lime); margin-bottom: 4px; word-break: break-word; }
  .tl-cmd-block {
    font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--lime);
    background: var(--lime-dim); border: 1px solid rgba(197,242,6,0.2);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; display: block;
    transition: background 0.15s;
    word-break: break-all;
    overflow-wrap: break-word;
    max-width: 100%;
  }
  .tl-cmd-block:hover { background: rgba(197,242,6,0.18); }
  .tl-hint { font-size: 13px; font-style: italic; color: var(--lime); line-height: 1.5; }
  .tl-gets { font-size: 13px; color: var(--text-body); line-height: 1.5; }

  .copy-block {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    min-width: 0;
  }
  .copy-cmd { flex: 1; min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text); word-break: break-all; overflow-wrap: break-word; }
  .copy-btn {
    background: var(--lime);
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-family: 'Heebo', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }
  .copy-btn:hover { opacity: 0.85; }
  .mcp-note {
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    color: var(--text-dim);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    direction: rtl;
  }

  /* Next steps */
  .next-section { display: flex; flex-direction: column; gap: 6px; }
  .next-section-label {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--lime);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .next-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: right;
    direction: rtl;
  }
  .next-btn:hover { border-color: rgba(197,242,6,0.3); background: var(--surface-hover); }
  .next-btn-emoji { font-size: 16px; flex-shrink: 0; }
  .next-btn-label { font-family: 'Heebo', sans-serif; font-size: 14px; font-weight: 600; color: var(--text); flex: 1; }
  .next-btn-hint { font-family: 'Heebo', sans-serif; font-size: 12px; color: var(--text-dim); margin-top: 1px; line-height: 1.4; }
  .next-btn-copy {
    flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--lime);
    background: rgba(197,242,6,0.08);
    border: 1px solid rgba(197,242,6,0.2);
    border-radius: 4px;
    padding: 2px 7px;
    white-space: nowrap;
  }

  /* Triggers */
  .triggers-section { direction: rtl; }
  .triggers-label {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.1em;

  {cmd:"doc-coauthoring", cat:"docs", uc:["content"], triggers:["תעזור לי לכתוב","co-authoring","PRD","מפרט טכני","הצעת מחיר","decision doc"], desc:"כותב מסמכים מורכבים איתך — PRD, מפרט טכני, הצעת מחיר — בתהליך מובנה", detail:"כשמנסים לכתוב מסמך רציני עם Claude בלי מבנה — מקבלים טקסט ארוך שלא ממש פוגע בצרכים. הסקיל הזה עושה את זה אחרת: הוא מנחה אותך דרך 3 שלבים:\n\n1. איסוף הקשר — Claude שואל שאלות עד שיש לו מה שצריך\n2. כתיבה ועיצוב — Claude כותב, אתה מגיב, חוזרים\n3. בדיקת קוהרנטיות — האם מי שיקרא את זה יבין?\n\nמתאים ל: הצעות מחיר, PRDs, מפרטים טכניים, decision docs, דוחות.\n\nמילות חיפוש: הצעת מחיר, PRD, מפרט, הסכם, חוזה, proposal, brief, מסמך עסקי", steps:[

  {cmd:"canvas-design", cat:"build", uc:["design","slides"], triggers:["תצור פוסטר","תמונה ויזואלית","artwork","PNG","thumbnail","עיצוב גרפי"], desc:"יוצר תמונות ופוסטרים ויזואליים — PNG ו-PDF עם עיצוב אמנותי", detail:"שונה לגמרי מ-frontend-design. הסקיל הזה יוצר יצירות ויזואליות סטטיות — פוסטרים, תמונות, artwork — לא דפי אינטרנט שעובדים.\n\nהתהליך:\n1. Claude מגדיר \"פילוסופיית עיצוב\" — תנועה אמנותית, אסתטיקה, קונספט\n2. ואז מבצע אותה ויזואלית כ-PNG או PDF\n\nמילות חיפוש: פוסטר, תמונה, עיצוב גרפי, thumbnail, יוטיוב, אינסטגרם, banner, artwork, עיצוב ויזואלי", steps:[

  {cmd:"web-artifacts-builder", cat:"build", uc:["web"], triggers:["shadcn","React app","TypeScript UI","תבנה אפליקציה","DataTable","web artifact"], desc:"בונה React apps מורכבים כ-artifact יחיד — עם shadcn/ui ו-Tailwind", detail:"frontend-design בונה HTML פשוט. web-artifacts-builder בונה אפליקציות React אמיתיות — עם state management, routing, קומפוננטות shadcn/ui מוכנות.\n\nמילות חיפוש: דשבורד, טפסים, טבלאות, לוח ניהול, ממשק ניהול, פילטרים, חיפוש, dashboard, forms, tables, data table, admin panel, interactive", steps:[

  {cmd:"skill-creator", cat:"build", uc:["dev"], triggers:["תצור סקיל","create a skill","שפר סקיל","בדוק סקיל","skill creator","eval"], desc:"יוצר ומשפר סקילים — זה הכלי שיצר את כל הסקילים ברשימה הזו", detail:"רוצה ליצור סקיל חדש לשימוש חוזר? או לשפר סקיל קיים? הסקיל הזה מדריך אותך בתהליך: מה הסקיל עושה, איך לנסח את ההוראות, ואיך לבדוק שהוא עובד.\n\nמילות חיפוש: סקיל חדש, create skill, שיפור, eval, בדיקת סקיל", steps:[

  {cmd:"loop", cat:"automation", uc:["automation"], triggers:["/loop","תריץ כל X דקות","תבדוק כל","בלופ","recurring","חוזר על"], desc:"מריץ פקודה שוב ושוב בפרק זמן קבוע", detail:"רוצה ש-Claude יבדוק משהו כל 5 דקות? או יריץ פקודה בלופ? הסקיל הזה עושה את זה. שימושי למעקב אחרי deploy, בדיקת סטטוס, או כל משימה חוזרת.\n\nמילות חיפוש: חזרה, אוטומטי, כל X דקות, תזכורת, polling, recurring", steps:[

  {cmd:"claude-md-management", cat:"automation", uc:["automation"], triggers:["CLAUDE.md","עדכן CLAUDE","זיכרון פרויקט","/revise-claude-md","update memory","claude memory"], desc:"מנהל את קובץ CLAUDE.md — מעדכן, משפר, ושומר את הזיכרון של הפרויקט", detail:"CLAUDE.md הוא הקובץ שClaude קורא בתחילת כל שיחה בפרויקט — שם יושב ה\"זיכרון\" של הפרויקט. עם הזמן הוא מתיישן.\n\nלסקיל יש שני כלים:\n• claude-md-improver — עובר על הcodebase, בודק אם ה-CLAUDE.md מעודכן, ומציע שיפורים\n• /revise-claude-md — פקודה שמריצים בסוף session כדי לתעד מה למדנו\n\nבלי זה: בכל שיחה חדשה Claude \"שוכח\" החלטות שהתקבלו.\n\nמילות חיפוש: זיכרון, הגדרות פרויקט, CLAUDE.md, הוראות קבועות, context", steps:[

  {cmd:"keybindings-help", cat:"automation", triggers:["קיצור מקלדת","keybinding","rebind","ctrl+","chord shortcut","שנה מקש"], desc:"מתאים קיצורי מקלדת ב-Claude Code", detail:"רוצה לשנות את מקש ה-submit? להוסיף chord shortcut? הסקיל מגדיר את זה ב-keybindings.json.\n\nמילות חיפוש: קיצור מקלדת, keybinding, מקש, shortcut, Ctrl, Enter", steps:[

  {cmd:"hookify:hookify", cat:"hookify", uc:["automation"], triggers:["פקודה ידנית"], desc:"יוצר hook שמונע מ-Claude לעשות דברים לא רצויים — לתמיד", detail:"נניח אמרת לClaude עשרים פעמים \"אל תוסיף אמוג'י\" — ואחרי שעה הוא שוב מוסיף. Hook הוא חוק שרץ אוטומטית לפני/אחרי כל פעולה של Claude, ועוצר אותו אם הוא עומד לעשות משהו שאסרת.\n\nלמשל:\n• \"אל תשתמש ב-innerHTML עם תוכן דינמי — XSS\"\n• \"לפני כל git push — שאל אישור\"\n• \"אל תוסיף אמוג'י בלי בקשה מפורשת\"\n\nכדי ליצור hook, פשוט תאר לClaude את ההתנהגות שרוצה למנוע. הוא יכתוב קובץ Python קטן שיעצור את זה בפעם הבאה.\n\nמילות חיפוש: hook, חוק, מניעה, התנהגות, rules", steps:[
    {t:"תאר לClaude מה לא רצוי, למשל:", c:null},
    {t:"Claude יפתח את hookify:hookify ויבנה קובץ hook", c:"מעכשיו בכל פעם שאתה עומד להשתמש ב-innerHTML עם משתנה, עצור ותזהיר אותי"},
    {t:"ה-hook רץ אוטומטית מכאן ואילך", c:null}
  ], usage:"/hookify:hookify"},
  {cmd:"hookify:configure", cat:"hookify", uc:["automation"], triggers:["פקודה ידנית"], desc:"מנהל hooks קיימים — הפעלה, כיבוי, מחיקה", detail:"ברגע שיש לך כמה hooks, כאן אפשר לנהל אותם:\n\n• לראות אילו hooks פעילים כרגע\n• לכבות hook זמנית בלי למחוק אותו (שימושי כשאתה רוצה לעשות משהו חד-פעמי)\n• למחוק hook שכבר לא רלוונטי\n• לשנות הגדרות של hook קיים\n\nחשוב: hook כבוי ≠ hook מחוק. כיבוי = \"תתעלם ממנו הפעם\".\n\nמילות חיפוש: hook, כיבוי, הפעלה, ניהול, configure, rules", steps:[

    {t:"תראה רשימת כל ה-hooks ומצבם (פעיל/כבוי)", c:null},
    {t:"בחר hook ספציפי לשינוי", c:null}
  ], usage:"/hookify:configure"},

  {cmd:"hookify:writing-rules", cat:"hookify", uc:["automation"], triggers:["פקודה ידנית"], desc:"מדריך לכתיבת חוקי hookify — תחביר, דפוסים, דוגמאות", detail:"Hook הוא סקריפט Python קטן שרץ לפני או אחרי כל פעולה של Claude. אם Claude עומד לעשות X — ה-hook יכול לעצור אותו, להזהיר אותו, או לתעד את זה.\n\nדוגמה: hook שעוצר כל שימוש ב-innerHTML ומזהיר על XSS — בדיוק מה שעצר אותי בבניית הדף הזה.\n\nהסקיל מסביר איך לכתוב את הקובץ, מה השדות, ואיך לבדוק שהוא עובד.\n\nמילות חיפוש: hook, כתיבה, חוקים, Python, XSS, rules, writing", steps:[

  {cmd:"plugin-dev:plugin-settings", cat:"plugins", uc:["dev"], triggers:["פקודה ידנית"], desc:"שמירת הגדרות ב-plugin — איך ה-plugin זוכר דברים בין שיחות", detail:"כשסוגרים שיחה עם Claude — הכל נמחק. אבל plugin יכול לשמור הגדרות שנשארות.\n\nדרכים לשמירה:\n• .local.md — קובץ markdown שClaude קורא בתחילת כל שיחה. שם, למשל, שומרים token, שם משתמש, העדפות.\n• YAML frontmatter — בתוך קובץ ה-.md של הסקיל אפשר להגדיר ערכי ברירת מחדל.\n\nמילות חיפוש: הגדרות, settings, זיכרון, .local.md, שמירה, configuration", steps:[

  {cmd:"mcp-builder", cat:"plugins", uc:["dev"], triggers:["תבנה MCP","MCP server","בנה שרת MCP","תחבר API ל-Claude","FastMCP","MCP SDK"], desc:"בונה MCP server שלם — מחבר API חיצוני לClaude", detail:"רוצה שClaude יוכל לדבר עם שירות שאין לו MCP רשמי? הסקיל מנחה אותך לבנות MCP server משלך.\n\nתהליך מובנה:\n1. מחקר — מה ה-API חושף, מה הuse cases\n2. תכנון — אילו tools לבנות (API coverage vs. workflow tools)\n3. ביצוע — Python (FastMCP) או TypeScript (MCP SDK)\n\nמילות חיפוש: MCP, חיבור, API, integration, server", steps:[

  {cmd:"build-mcp-server", cat:"plugins", uc:["dev"], triggers:["build-mcp-server","remote HTTP MCP","MCP App","MCPB Bundle","בנה MCP חדש"], desc:"נקודת כניסה לבניית MCP — בוחר ארכיטקטורה ומנתב לסקיל המתאים", detail:"חלק ממערכת mcp-server-dev. זה ה\"שאלון\" שעוזר להחליט איזה סוג MCP לבנות:\n\n• Remote HTTP — לשירותי cloud ו-APIs חיצוניים (ברירת מחדל)\n• MCP App — אם צריך UI (טפסים, dialogs) בתוך הצ'אט\n• MCPB Bundle — אם השרת צריך לגעת בקבצים מקומיים\n\nמילות חיפוש: MCP, חיבור, API, integration, server", steps:[

  {cmd:"plugin-dev:mcp-integration", cat:"plugins", uc:["dev"], triggers:["פקודה ידנית"], desc:"חיבור Claude לשירות חיצוני — Figma, Notion, Supabase ועוד", detail:"MCP (Model Context Protocol) הוא תקן שמאפשר ל-Claude \"לדבר\" עם תוכנות חיצוניות. בלי MCP — Claude יודע רק מה אתה מדביק לו. עם MCP — הוא יכול לפתוח Figma, לקרוא Notion, לשלוח ל-Supabase, הכל בפעולה אחת.\n\nמילות חיפוש: MCP, חיבור, API, integration, .mcp.json", steps:[

  {cmd:"security-check", cat:"automation", uc:["dev"], triggers:["תתקין סקיל","install skill","install plugin","הוסף plugin","תתקין MCP","install MCP","skills.sh","האם הסקיל בטוח","האם זה בטוח להתקין","לפני שאני מתקין"], desc:"בודק אבטחה לפני התקנת סקילים, plugins ו-MCP servers — מכל מקור", detail:"לפני שמתקינים סקיל מ-GitHub, skills.sh, או כל מקור חיצוני — הסקיל הזה רץ אוטומטית ובודק שאין בו כוונות זדוניות.\n\nמה הוא בודק:\n• Prompt injection — הוראות נסתרות שמנסות לשלוט ב-Claude\n• קריאות רשת — curl, fetch, webhook, requests\n• הרצת קוד — exec, subprocess, eval\n• גישה לקבצים רגישים — .env, credentials, ~/.ssh\n• Data exfiltration — שליחת מידע לכתובות חיצוניות\n• קוד מוסתר — base64, hex encoding\n• סקריפטים שרצים בהתקנה — install.sh, Makefile\n• מהימנות ה-repo — גיל, commits, contributors\n\nבסוף — דוח ממצאים + המלצה (בטוח / עם הסתייגות / מסוכן).\nלא מתקין דבר בלי \"כן\" מפורש ממך.\n\nמילות חיפוש: אבטחה, בדיקה, בטיחות, security, malware, זדוני, install", steps:[
    {t:"הסקיל מופעל אוטומטית כשאתה מבקש התקנה. אחרת:", c:null},
    {t:"Claude מוריד ל-/tmp, סורק כל קובץ, ומציג דוח:", c:"תתקין סקיל לפני התקנה"},
    {t:"אחרי הדוח — Claude מחכה לאישור שלך לפני שממשיך", c:null}
  ], usage:"מופעל אוטומטית לפני כל התקנה"},
  {cmd:"market", cat:"agency", uc:["analysis","content"], triggers:["/market audit","/market copy","/market emails","/market proposal","marketing audit","ביקורת שיווקית","נתח את האתר שיווקית"], desc:"15 פקודות שיווק — audit, copy, emails, ads, proposal ו-PDF לכל אתר", detail:"חבילת שיווק מלאה שמופעלת דרך /market <פקודה>.\n\nפקודות עיקריות:\n• /market audit <url> — ביקורת שיווקית מלאה עם 5 agents במקביל + ציון 0-100\n• /market quick <url> — snapshot מהיר ב-60 שניות\n• /market copy <url> — קופי מותאם עם before/after\n• /market emails <topic> — רצף אימיילים מלא\n• /market social <topic> — לוח תוכן 30 יום לרשתות\n• /market ads <url> — קריאייטיב ל-Meta/Google/LinkedIn\n• /market competitors <url> — competitive intelligence\n• /market proposal <url> — הצעת מחיר ללקוח מוכנה לשליחה\n• /market report-pdf <url> — דוח PDF מקצועי\n• /market landing <url> — אנליזת CRO לדף נחיתה\n• /market seo <url> — אודיט SEO\n• /market brand <url> — ניתוח קול מותג\n• /market launch <product> — playbook ללאנץ׳\n\nעלות ממוצעת לאודיט מלא: ~$0.05–$0.10 קרדיטי API", steps:[
    {t:"ציין URL של אתר לניתוח:", c:"market"},

  {cmd:"market-audit", cat:"agency", uc:["analysis"], triggers:["/market audit","ביקורת שיווקית מלאה","marketing audit","5 agents"], desc:"ביקורת שיווקית מלאה — 5 agents במקביל, ציון 0-100, MARKETING-AUDIT.md", detail:"הפקודה הראשית של החבילה. מפעילה 5 subagents במקביל:\n• market-content — איכות קופי ומסרים (25%)\n• market-conversion — CRO, טפסים, CTAs (20%)\n• market-competitive — positioning מול מתחרים (15%)\n• market-technical — SEO טכני ומבנה אתר (20%)\n• market-strategy — אסטרטגיה, תמחור, צמיחה (10%)\n\nפלט:\n• ציון כולל 0-100 ממוצע משוקלל\n• MARKETING-AUDIT.md עם executive summary\n• מוכן לשליחה ללקוח ישירות", steps:[
    {t:"ציין URL לאודיט:", c:"market-audit"},
    {t:"הוסף הקשר — סוג עסק וקהל יעד:", c:"\"/market audit https://clientsite.com\" — SaaS לניהול פרויקטים"},
    {t:"MARKETING-AUDIT.md עם ציון 0-100", c:null}
  ], usage:"\"תעשה ביקורת שיווקית לאתר הזה\""},
  {cmd:"market-proposal", cat:"agency", uc:["content","analysis"], triggers:["/market proposal","הצעת מחיר שיווקית","proposal ללקוח","תכין הצעת מחיר"], desc:"מייצר הצעת מחיר ללקוח אחרי audit — עם ממצאים, תמחור ולוח זמנים", detail:"הופך את ממצאי האודיט להצעת מחיר שניתן לשלוח ישירות ללקוח.\n\nמה כולל המסמך:\n• סיכום ממצאים + ציוני ה-audit\n• המלצות ממוקדות לפי priority (High/Medium/Low)\n• הצעת שירותים עם תמחור\n• לוח זמנים מוצע\n• CTA ברור\n\nהכי אפקטיבי כשמריצים אחרי /market audit — Claude מתבסס על הממצאים.", steps:[

  {cmd:"market-report-pdf", cat:"agency", uc:["analysis"], triggers:["/market report-pdf","דוח PDF שיווקי","marketing PDF report","דוח ללקוח PDF"], desc:"מקמפל ממצאי audit לדוח PDF עם גרפים וציונים — מוכן להגשה ללקוח", detail:"מייצר דוח PDF ויזואלי ומקצועי מכל ניתוחי /market.\n\nמה כולל הדוח:\n• עמוד שער עם שם הלקוח ותאריך\n• ציונים ויזואליים ב-6 קטגוריות\n• ממצאים מפורטים לפי priority\n• תוכנית פעולה ממועדפת\n• SWOT מול מתחרים\n\nדרישה: pip install reportlab\nפלט: MARKETING-REPORT.pdf", steps:[

  {cmd:"market-competitors", cat:"agency", uc:["analysis"], triggers:["/market competitors","competitive intelligence","ניתוח מתחרים","מה עושים המתחרים"], desc:"competitive intelligence — מזהה מתחרים, מנתח positioning, מייצר gap analysis", detail:"סורק את שוק המתחרים ומייצר דוח השוואתי.\n\nמה כולל הדוח:\n• זיהוי 3-5 מתחרים עיקריים\n• השוואת messaging ו-value propositions\n• positioning map\n• gap analysis — מה המתחרים לא מציעים\n• המלצות לדיפרנציאציה\n\nפלט: COMPETITOR-REPORT.md", steps:[

  {cmd:"market-emails", cat:"agency", uc:["content"], triggers:["/market emails","רצף אימיילים","email sequence","כתוב לי אימיילים"], desc:"מייצר רצף אימיילים מלא — welcome, nurture, launch, follow-up", detail:"כותב סדרת אימיילים מוכנה לשליחה לכל מטרה.\n\nסוגי רצפים:\n• Welcome sequence — 3-5 אימיילים לנרשמים חדשים\n• Launch sequence — 5-7 אימיילים לפני/אחרי לאנץ׳\n• Nurture sequence — חינוך קהל לקראת מכירה\n• Follow-up — אימיילים לאחר שיחת מכירה\n\nפלט: EMAIL-SEQUENCES.md עם כל האימיילים מוכנים", steps:[

  {cmd:"market-social", cat:"agency", uc:["content"], triggers:["/market social","לוח תוכן","social media calendar","30 יום תוכן"], desc:"מייצר לוח תוכן 30 יום לרשתות החברתיות — פוסטים מוכנים לפרסום", detail:"בונה לוח תוכן חודשי מפורט לרשתות.\n\nמה כולל:\n• 30 פוסטים מוכנים לפי ימים\n• מגוון פורמטים: tips, stories, behind-the-scenes, CTAs\n• תגיות, hashtags וזמני פרסום מומלצים\n• וריאציות לפלטפורמות שונות\n\nפלט: SOCIAL-CALENDAR.md", steps:[

  {cmd:"market-launch", cat:"agency", uc:["content","analysis"], triggers:["/market launch","launch playbook","תכנון לאנץ׳","איך להשיק מוצר"], desc:"מייצר playbook מלא להשקת מוצר — timeline, channels, messaging, KPIs", detail:"מתכנן את כל מהלך ההשקה מהתחלה ועד הסוף.\n\nמה כולל ה-playbook:\n• timeline שבועי לפני/אחרי הלאנץ׳\n• ערוצי שיווק ממוקדים לפי קהל יעד\n• messaging מרכזי ו-value proposition\n• KPIs ומדדי הצלחה\n• checklist משימות לפי שלב\n\nפלט: LAUNCH-PLAYBOOK.md", steps:[

  {cmd:"skill-pdf-guide", cat:"automation", uc:["content","design"], triggers:["צור מדריך לסקיל","תייצר מדריך PDF","create skill guide","מדריך לסקיל","תבנה מדריך","תייצר מדריך לסקיל"], desc:"יוצר מדריך PDF מעוצב לסקיל Claude Code לפי תבנית המותג של Yaroni Studio", detail:"הופך מידע על סקיל למדריך PDF מוכן לשיתוף ב-Instagram. 2 עמודים, עברית RTL, שחור + ירוק ניאון.\n\nמקורות קלט נתמכים:\n• מדריך הסקילים (claude-skills-guide.html) — חלץ לפי שם סקיל\n• מסמך Word (.docx) — קריאה עם סקיל docx\n• קובץ PDF — קריאה עם סקיל pdf\n• לינק לאתר — WebFetch\n\nמה מקבלים:\n• עמוד 1: Hook + בעיה + פתרון + פלטפורמות + קוד התקנה\n• עמוד 2: 3 שלבי workflow + 4 יתרונות + ציטוט + קישורי אתר\n• קובץ HTML מוכן לייצוא PDF עם Chrome Headless (export-pdf.sh)", steps:[

  ], usage:"\"צור מדריך לסקיל humanizer\""},
  {cmd:"carousel", cat:"automation", uc:["content","design"], triggers:["צור לי קרוסלה","תבנה לי קרוסלה","צור לי שקף לאינסטגרם"], desc:"יוצר קרוסלה לאינסטגרם — מספר שקפים מעוצבים 1080x1080, מיוצאים כ-PNG מוכן לפרסום", detail:"מביא נושא או סקיל — מקבל תמונות PNG מוכנות לאינסטגרם.\n\nמספר שקפים לפי תוכן:\n• נושא פשוט: 5 שקפים\n• נושא בינוני: 7 שקפים\n• נושא עמוק: 10 שקפים\n\nמה הסקיל עושה:\n• בונה HTML קרוסלה: cover, בעיה, פתרון, פירוט, איך עובד, תוצאות, CTA\n• שקף הפתיחה כולל גרפיקה SVG ייחודית לנושא\n• מחכה לאישור \"מאשר\" לפני ייצוא\n• מצלם כל שקף דרך Playwright ושומר PNG 1080x1080", steps:[
    {t:"אמור על מה הקרוסלה:", c:null},
    {t:"Claude בונה HTML, פותח בדפדפן — ממתין לאישור", c:"\"צור לי קרוסלה על multi-platform-distributor\""},

  ], usage:"\"צור לי קרוסלה על [נושא]\""},
  {cmd:"remotion-best-practices", cat:"build", uc:["content","design"], triggers:["תיצור ריל","תערוך סרטון","תיצור סטורי","תיצור אנימציה","תיצור וידאו","remotion"], desc:"יוצר ועורך סרטונים ואנימציות בעזרת Remotion — ספריית וידאו ב-React", detail:"יוצר ועורך סרטונים ואנימציות בקוד React עם Remotion.\n\nדוגמאות לפרומפטים:\n\nעריכת ריל מסרטון מצולם:\n\"יש לי סרטון בתיקייה. תערוך אותו עם Remotion — תחתוך קטעים שקטים, זום אין כשאני מדבר, כתוביות Rubik עברית, B-roll עתידני, מוזיקת רקע, מסך סיום. 9:16.\"\n\nעריכה דינמית עם קצב:\n\"הקובץ נמצא בתיקיית הסרטונים. אני רוצה עריכה דינמית, עם כתוביות, מוזיקה קצבית, וחיתוכים מהירים בסגנון רילס.\"\n\nריל אנימציה לאינסטגרם (בלי צילום):\n\"תיצרו ריל לאינסטגרם, 9:16, 15 שניות. רקע כהה עם גרדיאנט שזז. כותרת spring+רעידה, 3 נקודות שנכנסות בזו אחר זו, מסך סיום בפייד.\"\n\nסרטון נתונים / אינפוגרפיקה:\n\"גרף עמודות שמראה צמיחה חודשית. ינואר 1,200, פברואר 1,800, מרץ 3,400. העמודות עולות עם spring, מספרים סופרים. 10 שניות, 16:9.\"\n\nפורמטים: 9:16 ריל/סטורי | 16:9 יוטיוב | 1:1 אינסטגרם", steps:[
    {t:"תאר את הסרטון או האנימציה שרוצה ליצור / לערוך:", c:null},
    {t:"Claude יכתוב קוד Remotion מלא מוכן להרצה", c:"\"תיצור ריל 9:16, 15 שניות. גרדיאנט כחול-סגול שזז. כותרת spring+רעידה, 3 נקודות שנכנסות בזו אחר זו, מסך סיום בפייד.\""},
    {t:"מריצים עם Remotion Studio לתצוגה מקדימה ולרינדור", c:null}
  ], usage:"\"תיצור ריל / סרטון / אנימציה...\""},
  {cmd:"imagen-creative", cat:"build", uc:["content","design"], triggers:["תייצר קריאייטיבים","תבנה קריאייטיבים","צור תמונות למוצר","תייצר תמונות שיווקיות"], desc:"מייצר קריאייטיבים שיווקיים למוצרים פיזיים — Imagen 3 API", detail:"מקבל תמונת מוצר → מנתח → מייצר פרומפטים מגוונים → שולח ל-Google Imagen 3 API → מחזיר תמונות ממוספרות בתיקיית הפרויקט.\n\nזוויות שנוצרות אוטומטית:\n• Studio clean — מוצר על רקע נקי, תאורה מקצועית\n• Lifestyle — מוצר בשימוש ביומיום\n• Flatlay — מלמעלה עם אביזרים משלימים\n• Close-up texture — פרטים וחומר\n• Dramatic lighting — תאורה דרמטית\n• In-hand — יד מחזיקה את המוצר\n• Color pop — רקע צבעוני מנוגד\n\nפלטפורמות נתמכות: ריל 9:16 / קרוסלה 1:1 / יוטיוב 16:9\n\nהפלט: תמונות ממוספרות creative-01.png... + creative-log.md עם טבלת פרומפטים", steps:[
    {t:"לא צריך פקודה — תאר בשפה טבעית:", c:null},
    {t:"Claude ישאל אם חסר מידע (כמות, פלטפורמה)", c:"\"תייצר 10 קריאייטיבים למוצר בתיקייה ~/Desktop/bottle.jpg, פלטפורמה: ריל\""},

  {cmd:"kling-prompts", cat:"build", uc:["content","design"], triggers:["תכין פרומפטים להנפשה","תכתוב פרומפטים ל-Kling","תנפיש את"], desc:"מייצר פרומפטים להנפשה ב-Kling עבור קריאייטיבים שנבחרו", detail:"מקבל מספרי קריאייטיבים שבחרת → מנתח כל תמונה → כותב פרומפט תנועה מדויק לכל אחת → שומר kling-prompts.txt מוכן להעתקה ל-Kling.\n\nסוגי תנועה לפי מוצר:\n• בקבוק / כוס — טיפות מים, אדים עולים\n• בגד / אקססורי — בד מתנפנף, תנועה עדינה\n• מוצר קוסמטי — זרימת נוזל, ברק על אריזה\n• כל מוצר — Subtle float (המוצר מרחף קלות)\n\nהפלט: kling-prompts.txt עם פרומפט + הגדרות Kling מומלצות לכל תמונה.", steps:[

    {t:"kling-prompts.txt נשמר בתיקיית הפרויקט — מוכן להעתקה ל-Kling", c:null}
  ], usage:"\"תכין פרומפטים להנפשה ל-3, 8, 15\""},
  {cmd:"creative-brief", cat:"build", uc:["content","design"], triggers:["תייצר קריאייטיבים למוצר","ברייף מוצר","creative brief","פייפליין קריאייטיב"], desc:"ברייף אחד → קריאייטיבים AI → בחירה → פרומפטים ל-Kling", detail:"Orchestrator לפייפליין הקריאייטיב המלא. מקבל ברייף מוצר אחד ומריץ הכל:\n\n1. שואל על המוצר, תמונת מקור, פלטפורמה וכמות\n2. מייצר פרומפטים מגוונים (לוקיישן שונה לכל קריאייטיב)\n3. שולח ל-Google Imagen 3 API\n4. מציג רשימת תמונות ומחכה לבחירה\n5. מייצר פרומפטים להנפשה ב-Kling עבור מה שבחרת\n\nהפלט:\n• creatives/ — תמונות ממוספרות\n• creative-log.md — טבלת פרומפטים\n• kling-prompts.txt — פרומפטים + הגדרות Kling לפי פלטפורמה", steps:[
    {t:"לא צריך פקודה — תאר בשפה טבעית:", c:null},
    {t:"Claude מאשר סיכום ומבקש אישור לפני ריצה", c:"\"יש לי בקבוק מים בשם AquaFlow. התמונה ב-~/Desktop/bottle.jpg. רוצה 8 קריאייטיבים לריל.\""},
    {t:"אחרי שהתמונות מוכנות — בחר מה להנפיש:", c:"\"תכין פרומפטים להנפשה ל-2, 5, 8\""}
  ], usage:"\"יש לי מוצר X, תמונה ב-[PATH], רוצה [N] קריאייטיבים ל-[פלטפורמה]\""},
  {cmd:"business-analyst", cat:"agency", uc:["analysis"], triggers:["נתח","KPI","OKR","חשב ROI","ניתוח עסקי","business analysis"], desc:"אנליסט עסקי AI — KPIs, מודלים פרדיקטיביים, המלצות אסטרטגיות", detail:"הופך Claude לאנליסט עסקי בכיר. שימושי לעבודת סוכנות כשצריך להצדיק ערך ללקוח, לנתח ביצועים, או לבנות מסגרת מדידה.\n\nמה אפשר לעשות:\n• בניית מדדי הצלחה ויעדים לעסק (KPI = מה מודדים, OKR = מה רוצים להשיג)\n• ניתוח נטישת לקוחות, ערך לקוח לאורך זמן, עלות רכישה, ומשפך המכירות\n• חיזוי הכנסות עתידיות וניתוח קבוצות לקוחות לפי תקופת הצטרפות\n• חישוב גודל השוק — כמה לקוחות פוטנציאליים יש בסך הכל, כמה ניתן להגיע אליהם\n• תכנון ניסויים השוואתיים (לדוגמה: גרסה A מול גרסה B) וניתוח תוצאות\n• הצגת מסקנות מורכבות בשפה פשוטה לקהל שאינו טכני\n\nמילות חיפוש: KPI, ROI, ניתוח, נתונים, עסקי, מכירות, לקוחות, churn, metrics, אנליזה, דוח, תחזית, תמחור, pricing, שוק, market analysis", steps:[
    {t:"לא צריך פקודה — תאר את התרחיש בשפה טבעית:", c:"הלקוח שלי מנהל חנות בגדים אינטרנטית. רוב הלקוחות קונים פעם אחת ולא חוזרים. תנתח למה זה קורה ואיך לזהות מי עומד לעזוב לפני שזה קורה"},
    {t:"או לבניית מערך מדידה:", c:"אני מנהל סוכנות AI עם 5 אנשים ואין לי שום מספרים שאומרים לי אם אנחנו גדלים בכיוון הנכון — תבנה לי לוח מחוונים שאבדוק כל שבוע"},
    {t:"Claude יפעיל business-analyst אוטומטית ויחזיר ניתוח מלא", c:null}
  ], usage:"\"נתח / בנה framework / חשב ROI...\"", next:[
    {emoji:"📊", label:"בנה דשבורד ויזואלי", hint:"מציג את הנתונים מהניתוח בגרפים אינטראקטיביים", prompt:"בהתבסס על הניתוח העסקי שעשית, בנה דשבורד ויזואלי שמציג את הנתונים המרכזיים — גרפים, מדדי KPI, ותרשימים. השתמש בנתונים שהוצאת."},
    {emoji:"📋", label:"יצא לגיליון Excel", hint:"כל הנתונים מסודרים בטבלאות", prompt:"קח את הנתונים מהניתוח העסקי ויצא אותם לקובץ Excel מסודר — טבלאות, חישובים, ותרשימים בסיסיים."},
    {emoji:"📝", label:"כתוב דוח מקצועי", hint:"מסמך מוגמר לשיתוף עם לקוח", prompt:"כתוב דוח מקצועי מבוסס על הניתוח העסקי שעשית — מבוא, ממצאים עיקריים, גרף מגמות, ומסקנות עם המלצות."},
    {emoji:"🎯", label:"הפוך לפרזנטציה", hint:"מצגת מוכנה לפגישה עם לקוח", prompt:"על בסיס הניתוח העסקי, תכנן מצגת של 8-10 שקפים שמספרת את הסיפור בצורה ברורה — עם hook, בעיה, פתרון, נתונים, והמלצות."}
  ]},
  {cmd:"baseline-ui", cat:"build", uc:["design","qa"], triggers:["/baseline-ui","בנה UI","Tailwind component","בדוק UI","enforce design","check component"], desc:"אוכף חוקי UI בסיסיים — אנימציות, טיפוגרפיה, נגישות, Tailwind", detail:"מונע \"AI slop\" בממשקים. הסקיל מגדיר חוקים ברורים לכל עבודת UI:\n\n• אנימציות: רק transform ו-opacity, מקסימום 200ms לפידבק\n• טיפוגרפיה: text-balance לכותרות, tabular-nums לנתונים\n• layout: z-index קבוע, size-* לאלמנטים ריבועיים\n• עיצוב: אין גרדיאנטים ללא בקשה, אין glow כ-affordance ראשי\n\nמילות חיפוש: עיצוב נקי, UI חלק, אנימציות, טיפוגרפיה, נגישות, Tailwind, React components", steps:[
    {t:"להחיל על כל השיחה:", c:"/baseline-ui"},
    {t:"לבדיקת קובץ ספציפי:", c:"/baseline-ui MyComponent.tsx"},
    {t:"מחזיר: violations עם ציטוט מדויק + תיקון קוד", c:null}
  ], usage:"/baseline-ui / /baseline-ui <file>"},
  {cmd:"fixing-accessibility", cat:"build", uc:["web","qa"], triggers:["/fixing-accessibility","aria","WCAG","נגישות","keyboard navigation","screen reader"], desc:"מבדק ומתקן בעיות נגישות — ARIA, מקלדת, focus, ניגודיות", detail:"בודק שהממשק נגיש לכולם — כולל משתמשי מקלדת, screen readers, ורמות ניגודיות.\n\n9 קטגוריות לפי עדיפות:\n• שמות נגישים (aria-label לכפתורי icon)\n• גישת מקלדת (Tab, Escape)\n• ניהול focus ב-dialogs\n• סמנטיקה (button במקום div)\n• שגיאות בטפסים (aria-describedby)\n• הכרזות (aria-live)\n• ניגודיות וstates\n• מדיה ומוישן\n\nמעדיף תיקונים מינימליים — לא מעצב מחדש.\n\nמילות חיפוש: נגישות, ARIA, מקלדת, עיוורון, screen reader, contrast, ניגודיות צבעים", steps:[
    {t:"להחיל על כל השיחה:", c:"/fixing-accessibility"},
    {t:"לבדיקת קובץ:", c:"/fixing-accessibility LoginForm.tsx"},
    {t:"מחזיר: violation + למה זה חשוב + תיקון קוד", c:null}
  ], usage:"/fixing-accessibility / /fixing-accessibility <file>"},
  {cmd:"fixing-metadata", cat:"build", uc:["web","qa"], triggers:["/fixing-metadata","SEO","Open Graph","meta tags","canonical","og:image"], desc:"בודק ומתקן HTML metadata — SEO, Open Graph, canonical, JSON-LD", detail:"מוודא שכל דף מוגדר נכון לחיפוש ולשיתוף ברשתות חברתיות.\n\nמה בודק:\n• title ו-description בכל דף\n• canonical URL תואם ל-og:url\n• Open Graph tags לשיתוף (תמונה, כותרת, תיאור)\n• Twitter cards\n• JSON-LD structured data\n• robots directives (noindex לדפים פרטיים)\n• favicon ו-apple-touch-icon\n\nמילות חיפוש: SEO, גוגל, חיפוש, Open Graph, שיתוף, תמונת שיתוף, meta tags, canonical", steps:[
    {t:"להחיל על כל השיחה:", c:"/fixing-metadata"},
    {t:"לבדיקת דף ספציפי:", c:"/fixing-metadata src/app/page.tsx"},
    {t:"מחזיר: violations לפי עדיפות + תיקון", c:null}
  ], usage:"/fixing-metadata / /fixing-metadata <file>"},
  {cmd:"fixing-motion-performance", cat:"build", uc:["design","qa"], triggers:["/fixing-motion-performance","animation","jank","layout thrashing","will-change","scroll performance"], desc:"בודק ומתקן ביצועי אנימציות — layout thrashing, scroll, blur", detail:"אנימציה שגורמת ל-jank (קפיצות) היא בדרך כלל בגלל שמנפשים את הדבר הלא נכון. הסקיל בודק 9 קטגוריות:\n\n• never patterns: אל תנפש layout ברציפות\n• mechanism: ברירת מחדל — transform ו-opacity בלבד\n• measurement: batch DOM reads לפני writes\n• scroll: Scroll Timeline במקום addEventListener\n• blur: מקסימום 8px, לא על surfaces גדולות\n\nדוגמה: transition: width → transition: transform\n\nמילות חיפוש: ביצועים, אנימציות, גלילה, lag, jank, scroll, blur, performance", steps:[
    {t:"להחיל על כל השיחה:", c:"/fixing-motion-performance"},
    {t:"לבדיקת קובץ:", c:"/fixing-motion-performance animations.css"},
    {t:"מחזיר: violations עם השורה המדויקת + תיקון", c:null}
  ], usage:"/fixing-motion-performance / /fixing-motion-performance <file>"},
  {cmd:"MCP · Figma", cat:"mcp", uc:["design"], triggers:["מופעל אוטומטית בשיחה"], desc:"קריאה ועריכה של עיצובים ב-Figma ויצירת דיאגרמות ב-FigJam", detail:"Figma MCP מחבר את Claude ישירות לקבצי Figma שלך — Claude קורא layouts, צבעים, קומפוננטות וכותב קוד שמתאים בדיוק לעיצוב, בלי screenshots.\n\n⚠️ חשוב: הדבק תמיד URL של figma.com בשיחה — Claude לא יכול לגשת ל-Figma בלי URL.\n\nמתי לבחור Figma MCP ולא screenshot-to-code?\n• screenshot-to-code — יש לך תמונה של עיצוב ואתה רוצה קוד מהיר\n• Figma MCP — יש לך קובץ Figma אמיתי, אתה רוצה קוד שמתאים לצבעים/tokens/קומפוננטות המדויקות\n\nדוגמאות למה לכתוב:\n• \"תמיר את ה-frame הזה לקוד React: https://figma.com/design/abc123/...\"\n• \"מה ה-font size של הכותרת הראשית ב-design הזה?\"\n• \"תצור דיאגרמה ב-FigJam של הארכיטקטורה: API → DB → Frontend\"\n\nמה Figma MCP מחזיר:\n• קוד React+Tailwind מותאם לעיצוב\n• ערכי tokens: צבעים, גדלים, spacing\n• לינק לדיאגרמה ב-FigJam", steps:[
    {t:"שימוש 1 — המרת design לקוד: הדבק URL של Figma ובקש:", c:null},
    {t:"Claude יפתח את ה-design, יקרא את הצבעים והגדלים, ויכתוב קוד תואם", c:"https://figma.com/design/abc123/... תמיר לי את הframe הזה לקוד React"},
    {t:"שימוש 2 — יצירת דיאגרמה ב-FigJam: בקש בלי URL:", c:"תצור לי דיאגרמה ב-FigJam שמראה איך הbotשלנו מקבל הודעה מלקוח, מחפש בבסיס הנתונים, ועונה — לשליחה ללקוח"}
  ], usage:"הדבק URL של figma.com + בקשה / בקש יצירת דיאגרמה"},
  {cmd:"MCP · Canva", cat:"mcp", uc:["design"], triggers:["מופעל אוטומטית בשיחה"], desc:"יצירה, עריכה וייצוא של עיצובים ב-Canva ישירות מהשיחה", detail:"Canva MCP מאפשר ל-Claude ליצור ולערוך עיצובים ב-Canva בשפה טבעית — בלי לפתוח דפדפן.\n\n⚠️ חשוב: Canva הכי שימושי לתבניות מוכנות (פוסטים, banners, מצגות). לעיצוי מסכי אפליקציה — עדיף Stitch.\n\nמתי לבחור Canva ולא Stitch?\n• Stitch — mockups של אפליקציות ומסכי UI\n• Canva — פוסטים ברשתות חברתיות, banners, מצגות, חומרי שיווק\n\nדוגמאות למה לכתוב:\n• \"תצור פוסט לינקדאין 1200x627 עם הכותרת \\\"AI Agency 2025\\\" ורקע כהה\"\n• \"תשנה את הכותרת ב-design הזה ל-\\\"שירותי AI\\\": https://canva.com/design/...\"\n• \"תייצא את ה-design הזה כ-PNG\"\n\nמה Canva מחזיר:\n• לינק לצפייה ב-design\n• preview של העיצוב\n• אפשרות ייצוא ל-PNG/PDF", steps:[
    {t:"בקש עיצוב בשפה טבעית:", c:null},
    {t:"Claude ייצור design ב-Canva וישתף לינק", c:"תצור תמונת כותרת ל-LinkedIn עם הטקסט \"AI Agency\" ורקע כהה"},
    {t:"לעריכת design קיים:", c:"https://canva.com/design/... תשנה את הצבע הראשי לכחול כהה"}
  ], usage:"בקש עיצוב / הדבק URL של canva.com"},
  {cmd:"MCP · Gmail", cat:"mcp", triggers:["מופעל אוטומטית בשיחה"], desc:"קריאה, חיפוש וכתיבת טיוטות Gmail — מהשיחה", detail:"Gmail MCP מאפשר ל-Claude לחפש במיילים שלך, לקרוא שרשורים ולכתוב טיוטות — ישירות מהשיחה.\n\n⚠️ חשוב: Claude יכול לכתוב טיוטות אבל לא לשלוח מיילים. שליחה דורשת לחיצה ידנית ב-Gmail.\n\nמתי להשתמש ב-Gmail MCP ולא לפתוח Gmail?\n• כשרוצים לחפש בהיסטוריה ולסנתז מידע מכמה שרשורים\n• כשרוצים שClaude ינסח תשובה על בסיס תוכן המייל המקורי\n\nדוגמאות למה לכתוב:\n• \"מצא לי את כל המיילים מלקוח X מהשבוע האחרון\"\n• \"קרא את השרשור הזה ותסכם לי מה הוחלט\"\n• \"כתוב טיוטת תשובה למייל האחרון מירון — אנו מסכימים לפגישה ביום שלישי\"\n\nמה Gmail MCP מחזיר:\n• רשימת מיילים עם תאריך, שולח, נושא\n• תוכן שרשור מלא\n• טיוטה שנשמרת ב-Gmail שלך — מוכנה לשליחה", steps:[
    {t:"בקש בשפה טבעית:", c:null},
    {t:"Claude יחפש ב-Gmail ויציג תוצאות", c:"מצא לי מיילים עם המילה \"הצעת מחיר\" מהחודש האחרון"},
    {t:"לכתיבת טיוטה:", c:"תכתוב טיוטה לתשובה שאומרת שנקבע פגישה ב-X"}
  ], usage:"בקש חיפוש/קריאה/טיוטה בשפה טבעית"},
  {cmd:"MCP · Google Calendar", cat:"mcp", triggers:["מופעל אוטומטית בשיחה"], desc:"ניהול יומן Google — יצירה, חיפוש, זמנים פנויים", detail:"Google Calendar MCP מחבר את Claude ליומן שלך — הוא יכול לקרוא, ליצור, לעדכן ולמחוק אירועים בשפה טבעית.\n\n⚠️ חשוב: Claude יוצר אירועים אמיתיים ביומן. בדוק לפני שמאשר יצירה.\n\nמתי להשתמש בCalendar MCP?\n• לתיאום פגישות בלי לפתוח את Google Calendar\n• לחיפוש מתי אתה פנוי לפגישה מול משתתפים מרובים\n• לניהול אירועים חוזרים\n\nדוגמאות למה לכתוב:\n• \"מה יש לי ביומן מחר?\"\n• \"תוסיף פגישה \\\"קול עם לקוח\\\" ביום חמישי ב-10:00 לשעה\"\n• \"מתי אני פנוי השבוע לפגישה של 45 דקות?\"\n• \"תבטל את הפגישה מחר בבוקר\"\n\nמה Calendar MCP מחזיר:\n• רשימת אירועים עם שעה, מיקום, משתתפים\n• אישור יצירת/עדכון/מחיקת אירוע\n• חלונות זמן פנויים לתיאום", steps:[
    {t:"בקש ניהול יומן בשפה טבעית:", c:"מה יש לי ביומן מחר?"},
    {t:"לתיאום פגישה:", c:"תוסיף פגישה \"קול עם לקוח\" ביום חמישי ב-10:00 לשעה"},
    {t:"למציאת זמן פנוי:", c:"מתי אני פנוי השבוע לפגישה של 45 דקות?"}
  ], usage:"בקש ניהול יומן בשפה טבעית"},
  {cmd:"MCP · Notion", cat:"mcp", triggers:["מופעל אוטומטית בשיחה"], desc:"קריאה, כתיבה וחיפוש ב-Notion workspace", detail:"Notion MCP מחבר את Claude ל-workspace שלך — חיפוש, קריאה, כתיבה ועדכון דפים ו-databases ישירות מהשיחה.\n\n⚠️ חשוב: Claude גש לכל ה-workspace שלך. ודא שה-integration מחובר רק ל-pages שאתה רוצה.\n\nמתי Notion MCP שימושי?\n• CRM: הוספת לקוחות חדשים לdatabase, עדכון סטטוס\n• Meeting notes: קריאת סיכומים מהר בלי לפתוח Notion\n• Knowledge base: חיפוש ידע מצטבר בשיחה\n\nדוגמאות למה לכתוב:\n• \"תמצא את כל הדפים שמכילים \\\"AI agency\\\" ב-Notion שלי\"\n• \"תוסיף לקוח חדש לdatabase — שם: \\\"חברת X\\\", סטטוס: \\\"ליד\\\"\"\n• \"תקרא לי את ה-meeting notes של אתמול ותסכם\"\n• \"תצור דף חדש בתיקיית Clients עם הסיכום הזה\"\n\nמה Notion MCP מחזיר:\n• תוכן דפים ו-databases\n• אישור יצירה/עדכון\n• רשימת תוצאות חיפוש עם לינקים ישירים", steps:[
    {t:"בקש בשפה טבעית:", c:"תמצא את כל הדפים שמכילים \"AI agency\" ב-Notion שלי"},
    {t:"לכתיבה:", c:"תוסיף לקוח חדש לדטאבייס — שם: \"חברת X\", סטטוס: \"ליד\""},
    {t:"Claude יגש ל-Notion שלך ויבצע את הפעולה", c:null}
  ], usage:"בקש חיפוש/קריאה/כתיבה ב-Notion בשפה טבעית"},
  {cmd:"MCP · Vercel", cat:"mcp", uc:["dev","web"], triggers:["מופעל אוטומטית בשיחה"], desc:"ניהול deployments, logs ופרויקטים ב-Vercel", detail:"Vercel MCP מחבר את Claude ל-account Vercel שלך — בדיקת סטטוס deployments, קריאת logs ומידע על פרויקטים.\n\n⚠️ חשוב: Vercel MCP הוא read-only בעיקרו. לdeploy קוד — עדיין צריך push ל-git.\n\nמתי Vercel MCP שימושי?\n• לאבחון שגיאות ב-production מהשיחה, בלי לפתוח Vercel dashboard\n• לבדיקת סטטוס deploy אחרי push\n• לקריאת runtime logs בזמן אמת\n\nדוגמאות למה לכתוב:\n• \"מה הסטטוס של ה-deploy האחרון של my-app?\"\n• \"תראה לי runtime errors מה-10 דקות האחרונות\"\n• \"כמה deployments היו הבוקר ואיזה נכשל?\"\n• \"מה ה-URL של ה-preview לפי PR #42?\"\n\nמה Vercel MCP מחזיר:\n• סטטוס deploy: בנייה / הצלחה / כישלון\n• שורות log עם timestamps\n• URLs של deployments", steps:[
    {t:"בקש מידע בשפה טבעית:", c:"מה קרה בdeploy האחרון? האם יש שגיאות?"},
    {t:"לצפייה בלוגים:", c:"תראה לי runtime logs מה-5 דקות האחרונות של הפרויקט my-app"},
    {t:"Claude יגש ל-Vercel שלך וישיב", c:null}
  ], usage:"בקש מידע על deployments/logs בשפה טבעית"},
  {cmd:"MCP · Google Drive / Sheets / Docs", cat:"mcp", uc:["analysis","content","slides"], triggers:["מופעל אוטומטית בשיחה"], desc:"גישה לכל Google Workspace — Drive, Sheets, Docs, Slides, YouTube", detail:"Google Workspace MCP מחבר את Claude לכל שירותי Google — Drive, Sheets, Docs, Slides — לקריאה, כתיבה וחיפוש.\n\n⚠️ חשוב: הדבק URL ישיר לקובץ לגישה מהירה. בלי URL — Claude יחפש לפי שם, מה שלוקח יותר זמן.\n\nמה אפשר לעשות לפי שירות:\n• Google Drive: חיפוש קבצים, רשימת תיקיות\n• Google Sheets: קריאת נתונים, הוספת שורות, עדכון תאים\n• Google Docs: קריאה וסיכום, הוספת טקסט\n• Google Slides: קריאת תוכן שקפים\n\nדוגמאות למה לכתוב:\n• \"תקרא את הגיליון הזה ותסכם את עמודת ההכנסות: [URL]\"\n• \"תוסיף שורה לגיליון הלקוחות — שם: ירון, סטטוס: פעיל\"\n• \"תמצא קבצים שמכילים \\\"הצעת מחיר\\\" ב-Drive שלי\"\n\nמה Google Workspace MCP מחזיר:\n• תוכן קבצים וגיליונות\n• אישור כתיבה/עדכון\n• רשימת קבצים עם לינקים", steps:[
    {t:"לחיפוש ב-Drive:", c:"תמצא קבצים שמכילים \"הצעת מחיר\" ב-Google Drive שלי"},
    {t:"לקריאת Sheets:", c:"תקרא את הגיליון הזה: [URL של Google Sheets]"},
    {t:"להוספת נתונים לSheets:", c:"תוסיף שורה חדשה לגיליון — שם: ירון, סטטוס: לקוח, תאריך: היום"}
  ], usage:"הדבק URL של google.com / בקש חיפוש בשפה טבעית"},
  {cmd:"MCP · n8n", cat:"mcp", uc:["automation"], triggers:["מופעל אוטומטית בשיחה"], desc:"יצירה, עריכה והרצת automation workflows ב-n8n", detail:"n8n הוא כלי אוטומציה open-source שמחבר שירותים שונים. n8n MCP מאפשר ל-Claude ליצור, לערוך ולהריץ workflows ישירות.\n\n⚠️ חשוב: n8n מצוין לאוטומציה מתוזמנת (cron, triggers). לפעולות חד-פעמיות בדפדפן — עדיף Playwright.\n\nמתי n8n ולא Playwright?\n• Playwright — פעולה חד-פעמית בדפדפן בזמן אמת (scraping, לחיצות, טפסים)\n• n8n — תהליך שחוזר על עצמו, מחבר כמה שירותים, רץ אוטומטית לפי תזמון\n\nדוגמאות למה לכתוב:\n• \"תצור workflow שכל בוקר שולח סיכום מיילים לטלגרם\"\n• \"תראה לי את כל ה-workflows הפעילים\"\n• \"תריץ את ה-workflow של גיבוי הנתונים\"\n• \"תוסיף node ל-webhook ב-workflow X שמסנן לפי שם\"\n\nמה n8n MCP מחזיר:\n• רשימת workflows עם סטטוס (פעיל/כבוי)\n• אישור יצירת/עריכת workflow\n• תוצאות ריצת workflow", steps:[
    {t:"לרשימת workflows:", c:"תראה לי את כל ה-workflows שיש לי ב-n8n"},
    {t:"ליצירת workflow חדש:", c:"תצור workflow שכשמגיע מייל עם המילה \"urgent\" — שולח הודעה לטלגרם שלי"},
    {t:"Claude יגש ל-n8n שלך ויבנה את ה-workflow", c:null}
  ], usage:"בקש יצירה/ניהול של workflows בשפה טבעית"},
  {cmd:"MCP · context7", cat:"mcp", uc:["dev"], triggers:["מופעל אוטומטית בשיחה"], desc:"מחפש תיעוד עדכני של ספריות ו-frameworks — אוטומטית", detail:"context7 מביא תיעוד עדכני של ספריות ו-frameworks לשיחה — כי Claude מאומן עד אוגוסט 2025 וספריות משתנות.\n\n⚠️ חשוב: context7 לא תמיד מופעל. כדי לוודא — הוסף \\\"use context7\\\" בבקשה.\n\nמתי context7 עוזר?\n• גרסאות חדשות של Next.js, React, Tailwind, Prisma, Anthropic SDK\n• API שהשתנה אחרי 2025\n• הגדרות שספרייה שינתה בין גרסאות\n\nדוגמאות למה לכתוב:\n• \"איך מגדירים middleware ב-Next.js 15? use context7\"\n• \"מה ה-API החדש של Anthropic SDK ל-streaming? use context7\"\n• \"תראה לי דוגמה ל-server actions ב-Next.js 15\"\n\nמה context7 מחזיר:\n• תיעוד עדכני מהמקור הרשמי\n• דוגמאות קוד שעובדות עם הגרסה הנוכחית\n• הסבר על שינויים מגרסאות ישנות", steps:[
    {t:"פשוט שאל שאלה כרגיל — context7 יופעל אוטומטית:", c:null},
    {t:"Claude ישתמש בcontext7 לחיפוש תיעוד עדכני ויענה", c:"איך אני מגדיר middleware ב-Next.js 15?"},
    {t:"עובד עם: React, Next.js, Vue, Prisma, Anthropic SDK, ועוד מאות ספריות", c:null}
  ], usage:"שאל שאלות על ספריות כרגיל — מופעל אוטומטית"},
  {cmd:"MCP · Playwright", cat:"mcp", uc:["automation","qa"], triggers:["מופעל אוטומטית בשיחה"], desc:"אוטומציה בדפדפן — גלישה, מילוי טפסים, צילום screenshots", detail:"Playwright MCP מאפשר ל-Claude לפתוח דפדפן אמיתי, לגלוש לאתרים, ללחוץ, למלא טפסים ולצלם — הכל בזמן אמת.\n\n⚠️ חשוב: Playwright הוא לפעולות חד-פעמיות אינטראקטיביות. לאוטומציה מתוזמנת (cron, triggers) — עדיף n8n.\n\nמתי Playwright ולא n8n?\n• n8n — אוטומציה שחוזרת על עצמה, cron jobs, חיבור בין שירותים\n• Playwright — פעולה שדורשת דפדפן עכשיו: scraping, בדיקה, מילוי טופס חד-פעמי\n\nדוגמאות למה לכתוב:\n• \"תגלוש ל-google.com ותחפש 'Claude API' ותחזיר 5 תוצאות ראשונות\"\n• \"תצלם screenshot של https://example.com\"\n• \"תמלא את טופס הרשמה ב-[URL] עם הפרטים האלה\"\n• \"תבדוק אם הלינקים בדף הזה עובדים\"\n\nמה Playwright מחזיר:\n• תוכן טקסטואלי מהדף\n• screenshot\n• תוצאות בדיקת לינקים / scraping", steps:[
    {t:"בקש פעולה בדפדפן:", c:"תגלוש ל-google.com ותחפש \"Claude API\" ותחזיר לי את 5 התוצאות הראשונות"},
    {t:"לצילום screenshot:", c:"תצלם screenshot של https://example.com"},
    {t:"Claude יפתח דפדפן ויבצע את הפעולה", c:null}
  ], usage:"בקש פעולה בדפדפן בשפה טבעית"},
  {cmd:"MCP · Supabase", cat:"mcp", uc:["analysis","dev"], triggers:["מופעל אוטומטית בשיחה"], desc:"גישה לdata ב-Supabase — קריאה, כתיבה, שאילתות", detail:"Supabase MCP מחבר את Claude ל-database שלך — שאילתות, כתיבה, קריאת סכמה — ישירות מהשיחה.\n\n⚠️ חשוב: Claude מדבר עם ה-database הפרודקשן שלך ישירות. הגדר role עם הרשאות מינימליות (read-only כברירת מחדל).\n\nמתי Supabase MCP שימושי?\n• לבדיקת נתונים מהיר בלי לכתוב קוד\n• לניתוח: כמה משתמשים, כמה orders, מה הטרנד\n• לאבחון בעיות: האם הרשומה הזו קיימת? מה הסכמה?\n\nדוגמאות למה לכתוב:\n• \"כמה לקוחות נרשמו השבוע? (מטבלת users)\"\n• \"תוסיף lead חדש — שם: \\\"ירון\\\", מייל: \\\"test@test.com\\\", מקור: \\\"linkedin\\\"\"\n• \"מה הסכמה של טבלת orders? אילו עמודות יש?\"\n• \"תמצא את כל ה-orders מהשבוע האחרון עם סטטוס pending\"\n\nמה Supabase MCP מחזיר:\n• תוצאות שאילתה עם כל העמודות\n• אישור כתיבה/הוספה\n• תיאור סכמה של טבלה", steps:[
    {t:"לשאילתה:", c:"כמה לקוחות נרשמו השבוע? (מטבלת users ב-Supabase שלי)"},
    {t:"לכתיבה:", c:"תוסיף lead חדש — שם: \"ירון\", מייל: \"test@test.com\", מקור: \"linkedin\""},
    {t:"Claude יגש ל-Supabase שלך ישירות", c:null}

  {cmd:"MCP · Stitch", cat:"mcp", uc:["design","web"], triggers:["תצור mockup","תצור מסך","תבנה לי UI","תעצב לי מסך","תצור design system","צור לי פרויקט ב-Stitch","mockup ללקוח","עיצוב ויזואלי לפני קוד","מופעל אוטומטית בשיחה"], desc:"יצירת mockups ו-design systems — להציג ללקוח לפני שכותבים קוד", detail:"Stitch הוא כלי לבניית מסכי UI ויזואליים — לא קוד, אלא תמונות/mockups שנראים כמו אפליקציה אמיתית.\n\n⚠️ חשוב: ציין תמיד \"ב-Stitch\" בבקשה — בלי זה Claude עלול לבחור frontend-design או כלי אחר.\n\nמתי לבחור Stitch ולא frontend-design?\n• frontend-design — אתה רוצה קוד HTML/CSS/JS שעובד ב-production\n• Stitch — אתה רוצה mockup ויזואלי להציג ללקוח, לקבל אישור, או לתכנן לפני שמתחילים לקודד\n\nדוגמאות למה לכתוב:\n• \"תצור mockup ב-Stitch למסך dashboard — סייד בר שמאלי, כרטיסי נתונים, גרף מכירות\"\n• \"תבנה ב-Stitch design system בצבעים כחול כהה ולבן, פונט Inter, כפתורים מעוגלים\"\n• \"תצור ב-Stitch 3 מסכים לאפליקציה: login, dashboard, ודף פרופיל\"\n\nמה Stitch מחזיר:\n• קישור לצפייה ב-mockup\n• תמונת preview\n• אפשרות לייצוא לשיתוף עם מעצב או לקוח", steps:[
    {t:"אין פקודה — Stitch מופעל אוטומטית כשמבקשים mockup ויזואלי",c:null},
    {t:"ציין 'ב-Stitch' בבקשה כדי לוודא שימוש בו ולא בכלי אחר. תאר את המסכים, מה יש בהם, וצבעים",c:"\"אני בונה אפליקציה לניהול משימות לצוות.\nתצור לי mockup ב-Stitch ל-2 מסכים:\n1. מסך ראשי — רשימת משימות עם checkbox, לכל משימה: כותרת, סטטוס (פתוח/בתהליך/הושלם), תאריך יעד, ואחראי. כפתור הוספה בתחתית, סרגל חיפוש בראש.\n2. מסך פרטי משימה — שנפתח בלחיצה על משימה, עם כל השדות + תיבת תגובות + כפתורי עדכון סטטוס.\nצבעים בהירים, מינימליסטי.\""},
    {t:"מקבל קישור למסך ב-Stitch + preview — מוכן להצגה ללקוח",c:null}
  ], usage:"\"תצור mockup למסך [שם המסך] — [תיאור קצר של מה יש בו]\""},
  {cmd:"copywriting", cat:"build", uc:["content","web"], triggers:["כתוב קופי","שפר את הקופי","כתוב תוכן לדף","כתוב headline","copywriting","שפר את ה-CTA","כתוב value proposition"], desc:"כותב קופי שיווקי לדפי נחיתה, דפי בית, תמחור ועמודי features", detail:"כשיש לך מוצר טוב אבל הטקסט בדף לא ממיר — זה הסקיל. הוא מנחה אותך לכתוב קופי שמשכנע: headline חד, subheadline שמרחיב, CTA שגורם ללחוץ.\n\nמה הסקיל עושה:\n• שואל שאלות על המוצר, הקהל, והמתחרים לפני שכותב\n• מיישם עקרונות copywriting: Benefits > Features, ספציפיות, שפת הלקוח\n• מחזיר קופי לפי סקשן: Hero, Social Proof, Benefits, How It Works, CTA\n• מספק 2–3 אלטרנטיבות ל-headline ול-CTA\n\nמילות חיפוש: קופי, landing page, דף נחיתה, headline, CTA, שיווק, המרות, conversion", steps:[

  ]},
  {cmd:"humanizer", cat:"automation", uc:["content"], triggers:["תמחק סימני AI","תהפוך לאנושי","תסיר את ה-AI","make this human","humanize","הטקסט נשמע AI","תשנה את הסגנון","תכתוב מחדש"], desc:"מסיר דפוסי כתיבת AI מטקסט — מחזיר קול אנושי, ישיר, עם אישיות", detail:"כתבת טקסט עם AI ועכשיו הוא נשמע \"כמו AI\"? זה הסקיל. הוא מבוסס על מדריך Wikipedia \"Signs of AI writing\" ומזהה 29 דפוסים ספציפיים.\n\nמה הוא מסיר:\n• מילים מנופחות: \"crucial\", \"pivotal\", \"groundbreaking\", \"tapestry\"\n• ניסוחי em-dash מוגזמים\n• \"rule of three\" כפוי\n• פסקאות \"Challenges and Future Prospects\"\n• משפטי סיום גנריים (\"exciting times lie ahead\")\n\nמה הוא מוסיף:\n• קצב משתנה — משפטים קצרים וארוכים לסירוגין\n• דעה ברורה, לא דיווח נייטרלי\n• קול אישי בגוף ראשון כשמתאים\n\nבונוס: אפשר לתת דוגמת כתיבה שלך → הסקיל ישכתב בסגנון שלך.\n\nמילות חיפוש: AI writing, ChatGPT, סגנון, כתיבה, אנושי, ניסוח, עריכה", steps:[

  ], usage:"\"תסיר מהטקסט הזה סימני AI כתיבה\""},

  {cmd:"viral-content-optimizer", cat:"post", uc:["content"], triggers:["תמקסם את הפוסט","תייעל לוויראליות","תשפר את הפוסט","תחזק את ה-hook","optimize for viral","make it viral","תשפר engagement"], desc:"מייעל פוסט לוויראליות מקסימלית — hook, retention, CTA, דירוג לפני/אחרי", detail:"כתבת פוסט ורוצה לדעת עד כמה הוא ויראלי — ומה לשנות? הסקיל הזה מנתח ומשפר.\n\nמה הוא עושה:\n• ניתוח: מעריך את ה-hook, retention, CTA ואורך הפוסט\n• עריכה לפי 5 עקרונות ויראליות: Hook תוך 3 שניות, Open Loop, Value Density, Pattern Interrupt, CTA טבעי\n• מחזיר גרסה משופרת + 5 שינויים עיקריים עם הסבר\n• דירוג 1-10 לפני ואחרי — עם הסבר\n• תומך כל הפלטפורמות: לינקדאין, אינסטגרם, X, פייסבוק\n\nמילות חיפוש: פוסט, ויראלי, engagement, hook, לינקדאין, שיפור, עריכה, תוכן", steps:[

  {cmd:"multi-platform-distributor", cat:"post", uc:["content"], triggers:["תפיץ לכל הפלטפורמות","תכפיל לכל הרשתות","תשכתב לכל הפלטפורמות","distribute to all platforms","תפרסם בכולם","תכתוב לכל הרשתות","תתאים לכל פלטפורמה"], desc:"מתאים פוסט אחד ל-4 פלטפורמות — לינקדאין, אינסטגרם, X, פייסבוק, כל אחת בפורמט שלה", detail:"יש לך פוסט מוכן ורוצה להפיץ אותו לכולן? הסקיל שוכתב אותו ל-4 גרסאות — לא מקצר, שוכתב מחדש לכל פלטפורמה.\n\nמה הוא עושה:\n• לינקדאין: hook מקצועי + גוף בפסקאות + חתימת ירוני\n• אינסטגרם: 3–5 שורות + emoji במינון + 5–8 hashtags\n• X: tweet יחיד עד 280 תווים או thread ממוספר\n• פייסבוק: שפה שיחתית וחמה, נגישה לקהל לא-טכני\n\nמילות חיפוש: הפצה, רשתות חברתיות, לינקדאין, אינסטגרם, X, טוויטר, פייסבוק, פוסט, distribution, repurpose", steps:[

  {cmd:"screenshot-to-code", cat:"build", uc:["design","web"], triggers:["תמיר צילום מסך לקוד","תכתוב קוד מהתמונה","screenshot to code","המר תמונה לקוד","תשחזר את הממשק","תבנה את זה מהצילום"], desc:"ממיר צילום מסך / תמונת UI לקוד עובד — HTML, CSS, React, או Vue", detail:"יש לך צילום מסך של אתר, אפליקציה, או עיצוב — הסקיל הופך אותו לקוד מוכן.\n\nמה הסקיל עושה:\n• מנתח layout, רכיבים, צבעים, גופנים, מרווחים ו-shadows\n• מזהה קומפוננטות: כפתורים, קלטים, כרטיסים, navigation, modals\n• מייצר קוד responsive לפי הפריימוורק שבחרת\n\nפריימוורקים נתמכים:\n• HTML/CSS טהור\n• React עם Tailwind CSS\n• Vue עם Tailwind\n\nמילות חיפוש: צילום מסך, תמונה, UI, עיצוב, HTML, CSS, React, Vue, קוד, ממשק", steps:[

  {cmd:"ui-cloner", cat:"build", uc:["design","web"], triggers:["תשכפל את האתר","תנתח את העיצוב","תשחזר את הסגנון","clone the UI","replicate website","SRIP","תעתיק את הממשק"], desc:"משכפל עיצוב UI מ-URL — 4 שלבי SRIP: ניתוח → ראיון מותג → סינתזה → בקרת איכות", detail:"נותן URL של אתר שאהבת — הסקיל ינתח אותו, ישאל על המותג שלך, ויחזיר פרומפט שיכפול את העיצוב עם הזהות שלך.\n\nה-4 שלבים (SRIP Pipeline):\n• שלב 1 — forensic-audit: ניתוח עיצובי פורנזי של ה-URL\n• שלב 2 — brand-interview: שאלות על המותג, הצבעים, האסתטיקה שלך\n• שלב 3 — synthesis: מיזוג ה-DNA העיצובי של האתר עם המותג שלך\n• שלב 4 — quality-check: פרומפט סופי לביצוע\n\nשונה מ-website-cloner: ui-cloner מייצר *פרומפט* לפיתוח, website-cloner מבצע שכפול ישיר.\n\nמילות חיפוש: שכפול אתר, עיצוב, סגנון, SRIP, clone, UI, landing page, אסתטיקה", steps:[
