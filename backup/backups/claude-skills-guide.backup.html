<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaroni · Claude Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;700;800&family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root {
    --bg:#090909;--surface:#111;--card:#161616;--border:#252525;
    --border-hover:#3a3a3a;--text:#e8e8e8;--muted:#9ca3af;--faint:#333;--accent:#f5a623;
    --cat-post:#e879f9;--cat-agency:#60a5fa;--cat-dev:#34d399;--cat-docs:#fbbf24;
    --cat-build:#a78bfa;--cat-automation:#fb923c;--cat-telegram:#38bdf8;
    --cat-hookify:#f87171;--cat-plugins:#4ade80;--cat-mcp:#06b6d4;
    --lime:#a3e635;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Assistant',sans-serif;min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}

  .shell{position:relative;z-index:1;display:flex;height:100vh;overflow:hidden}

  aside{width:220px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
  .logo-area{padding:24px 20px 20px;border-bottom:1px solid var(--border)}
  .logo-title{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.3px}
  .logo-sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.5px}
  .sidebar-search{padding:14px 16px;border-bottom:1px solid var(--border)}
  .search-wrap{position:relative}
  .search-wrap i{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);width:14px;height:14px}
  .search-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Assistant',sans-serif;font-size:15px;padding:8px 34px 8px 10px;outline:none;transition:border-color .15s}
  .search-input::placeholder{color:var(--muted)}
  .search-input:focus{border-color:var(--border-hover)}
  .cat-nav{padding:10px 8px;flex:1}
  .cat-nav-label{font-family:'Assistant',sans-serif;font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--muted);padding:0 8px;margin-bottom:6px;text-transform:uppercase}
  .cat-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:6px;border:none;background:transparent;cursor:pointer;color:var(--muted);font-family:'Assistant',sans-serif;font-size:15px;font-weight:600;text-align:left;transition:all .15s}
  .cat-btn:hover{background:rgba(255,255,255,.04);color:var(--text)}
  .cat-btn.active{background:rgba(255,255,255,.06);color:var(--text)}
  .uc-nav{padding:4px 8px 10px;border-top:1px solid var(--border)}
  .uc-btn{display:flex;width:100%;padding:6px 10px;border-radius:6px;border:none;background:transparent;cursor:pointer;color:var(--muted);font-family:'Assistant',sans-serif;font-size:14px;font-weight:500;text-align:right;direction:rtl;transition:all .15s}
  .uc-btn:hover{background:rgba(255,255,255,.04);color:var(--text)}
  .uc-btn.active{background:rgba(163,230,53,.1);color:var(--lime)}
  .cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .cat-count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:#888;background:rgba(255,255,255,.08);border-radius:4px;padding:1px 5px}
  .sidebar-footer{padding:14px 16px;border-top:1px solid var(--border)}

  main{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
  .main-header{padding:28px 32px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;justify-content:space-between;gap:20px;position:sticky;top:0;background:rgba(9,9,9,.95);backdrop-filter:blur(10px);z-index:10}
  .header-left h1{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.5px}
  .header-left p{font-size:13px;color:var(--muted);margin-top:3px;font-family:'JetBrains Mono',monospace}
  .skills-total{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 10px;white-space:nowrap}
  .skills-total span{color:var(--accent);font-weight:700}

  .grid-area{padding:24px 32px 40px}
  .section-label{font-family:'Syne',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);margin-bottom:14px;margin-top:32px;display:flex;align-items:center;gap:10px}
  .section-label:first-of-type{margin-top:0}
  .section-label::after{content:'';flex:1;height:1px;background:var(--border)}
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

  .skill-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .2s,transform .15s,box-shadow .2s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px}
  .skill-card:hover{border-color:var(--border-hover);transform:translateY(-1px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .skill-card:hover::before{opacity:1}
  .skill-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:0;transition:opacity .2s}

  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .cmd-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:5px;padding:5px 10px;font-family:'JetBrains Mono',monospace;font-size:13px;color:#c8c8c8;flex:1;word-break:break-all;transition:all .15s}
  .skill-card:hover .cmd-pill{border-color:var(--accent);color:var(--accent)}
  .cmd-pill .copy-icon{width:11px;height:11px;flex-shrink:0;opacity:.4}
  .cat-tag{flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-radius:4px;padding:3px 6px;opacity:.85}
  .card-desc{font-size:15px;color:#c8c8c8;line-height:1.6;direction:rtl;font-family:'Assistant',sans-serif}
  .card-hint{font-family:'Assistant',sans-serif;font-size:13px;color:var(--faint);display:flex;align-items:center;gap:5px;margin-top:2px}
  .trigger-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;border-radius:4px;padding:2px 7px;letter-spacing:.3px}
  .trigger-slash{background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.2)}
  .trigger-auto{background:rgba(245,166,35,.1);color:var(--accent);border:1px solid rgba(245,166,35,.2)}
  .card-context-short{font-family:'Assistant',sans-serif;font-size:13px;color:#C5F206;background:rgba(197,242,6,0.06);border-right:2px solid rgba(197,242,6,0.4);padding:5px 10px;border-radius:4px;direction:rtl;margin-top:4px;font-style:italic}
  .context-box{background:rgba(197,242,6,0.05);border:1px solid rgba(197,242,6,0.2);border-radius:8px;padding:14px 16px;direction:rtl;display:flex;flex-direction:column;gap:12px;margin-bottom:4px}
  .context-box-title{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#C5F206;margin-bottom:2px}
  .context-layer{display:flex;flex-direction:column;gap:4px}
  .context-layer-label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#888}
  .context-layer-text{font-family:'Assistant',sans-serif;font-size:14px;color:#d1d5db;line-height:1.5}
  .context-example{color:#C5F206;background:rgba(197,242,6,0.06);padding:6px 10px;border-radius:4px;font-style:italic}
  .context-expect{color:#94a3b8;font-size:13px}
  .steps-timeline{display:flex;flex-direction:column;direction:rtl;margin-bottom:4px}
  .timeline-step{display:flex;gap:12px;position:relative}
  .timeline-left{display:flex;flex-direction:column;align-items:center;width:24px;flex-shrink:0}
  .timeline-dot{width:10px;height:10px;border-radius:50%;background:#C5F206;flex-shrink:0;margin-top:5px;box-shadow:0 0 6px rgba(197,242,6,0.4)}
  .timeline-connector{width:2px;background:rgba(197,242,6,0.2);flex:1;min-height:16px;margin-top:4px}
  .timeline-step:last-child .timeline-connector{display:none}
  .timeline-content{padding-bottom:16px;flex:1;min-width:0}
  .timeline-label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#6b7280;margin-bottom:5px}
  .timeline-invoke{background:rgba(197,242,6,0.08);border:1px solid rgba(197,242,6,0.3);border-radius:6px;padding:5px 12px;font-family:'JetBrains Mono',monospace;font-size:13px;color:#C5F206;display:inline-block;cursor:pointer}
  .timeline-invoke:hover{background:rgba(197,242,6,0.15)}
  .timeline-example{font-family:'Assistant',sans-serif;font-size:14px;color:#C5F206;font-style:italic;line-height:1.5;background:rgba(197,242,6,0.05);padding:6px 10px;border-radius:4px}
  .timeline-asks{font-family:'Assistant',sans-serif;font-size:13px;color:#94a3b8;line-height:1.6}
  .timeline-result{font-family:'Assistant',sans-serif;font-size:14px;color:#d1d5db;line-height:1.5}

  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#000;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;letter-spacing:.5px;padding:9px 20px;border-radius:40px;opacity:0;transition:all .25s;pointer-events:none;z-index:999}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--faint);font-family:'JetBrains Mono',monospace;font-size:13px}

  /* ── Detail drawer ── */
  .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
  .drawer-overlay.open{opacity:1;pointer-events:all}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:460px;max-width:100vw;background:#141414;border-right:1px solid var(--border-hover);z-index:201;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
  .drawer.open{transform:translateX(0)}
  .drawer-bar{height:4px;flex-shrink:0}
  .drawer-header{padding:24px 24px 18px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .drawer-cmd{font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--accent);word-break:break-all;flex:1;line-height:1.5}
  .drawer-close{background:none;border:none;cursor:pointer;color:var(--muted);padding:3px;flex-shrink:0;transition:color .15s}
  .drawer-close:hover{color:var(--text)}
  .drawer-body{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:20px;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}

  .triggers-section{margin:16px 0 0;direction:rtl}
  .triggers-label{font-size:13px;font-family:'JetBrains Mono',monospace;letter-spacing:1px;color:#d1d5db;text-transform:uppercase;margin-bottom:8px;text-align:right}
  .triggers-list{display:flex;flex-wrap:wrap;gap:6px}
  .trigger-chip{background:rgba(163,230,53,.08);border:1px solid rgba(163,230,53,.2);color:#a3e635;font-size:12px;font-family:'JetBrains Mono',monospace;padding:3px 10px;border-radius:20px}
  .trigger-chip.manual{background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2);color:#818cf8}

  .drawer-tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-radius:4px;padding:4px 8px;margin-bottom:4px}
  .drawer-short{font-size:17px;color:var(--text);line-height:1.6;direction:rtl;text-align:right;font-family:'Assistant',sans-serif;font-weight:600}

  .detail-section{display:flex;flex-direction:column;gap:8px;direction:rtl}
  .detail-section-label{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#d1d5db;text-align:right}
  .detail-text{font-size:16px;color:var(--text);line-height:1.75;direction:rtl;text-align:right;font-family:'Assistant',sans-serif;white-space:pre-wrap}

  .example-box{background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:8px;padding:14px 16px;direction:rtl}
  .example-label{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#d1d5db;margin-bottom:8px;text-align:right;direction:rtl}
  .example-step{display:flex;gap:10px;margin-bottom:8px;direction:rtl}
  .example-step:last-child{margin-bottom:0}
  .step-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);flex-shrink:0;margin-top:2px}
  .step-text{font-size:15px;color:#d1d5db;line-height:1.5;font-family:'Assistant',sans-serif;text-align:right}
  .step-code{font-family:'JetBrains Mono',monospace;font-size:13px;color:#c8c8c8;background:rgba(255,255,255,.05);border-radius:4px;padding:8px 10px;display:block;margin-top:4px;direction:ltr;white-space:pre-wrap;line-height:1.7}

  .copy-cmd-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px;background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.3);border-radius:8px;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:14px;cursor:pointer;transition:all .2s;margin-top:4px}
  .copy-cmd-btn:hover{background:rgba(245,166,35,.2)}

  /* ── Next steps section ── */
  .next-section{display:flex;flex-direction:column;gap:8px;direction:rtl;margin-top:4px}
  .next-section-label{font-family:'Assistant',sans-serif;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#d1d5db;text-align:right;margin-bottom:4px}
  .next-btn{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .18s;text-align:right;direction:rtl}
  .next-btn:hover{border-color:#4a9eff;background:rgba(74,158,255,.06)}
  .next-btn-emoji{font-size:16px;flex-shrink:0}
  .next-btn-label{font-family:'Assistant',sans-serif;font-size:14px;font-weight:600;color:var(--text);flex:1}
  .next-btn-hint{font-family:'Assistant',sans-serif;font-size:12px;color:var(--muted);margin-top:1px;line-height:1.4}
  .next-btn-copy{flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:10px;color:#4a9eff;background:rgba(74,158,255,.1);border:1px solid rgba(74,158,255,.2);border-radius:4px;padding:2px 7px;white-space:nowrap}

  /* ── Add modal ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .modal-overlay.open{opacity:1;pointer-events:all}
  .modal{background:var(--card);border:1px solid var(--border-hover);border-radius:14px;padding:28px;width:440px;max-width:calc(100vw - 40px);transform:scale(.95) translateY(10px);transition:transform .25s;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .modal-overlay.open .modal{transform:scale(1) translateY(0)}
  .modal h2{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
  .modal-close{background:none;border:none;cursor:pointer;color:var(--muted);padding:2px;transition:color .15s}
  .modal-close:hover{color:var(--text)}
  .form-group{margin-bottom:14px}
  .form-group label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .form-group input,.form-group select,.form-group textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'Assistant',sans-serif;font-size:13px;padding:9px 12px;outline:none;transition:border-color .15s}
  .form-group textarea{resize:vertical;min-height:60px}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
  .form-group select option{background:#1a1a1a}
  .modal-actions{display:flex;gap:10px;margin-top:20px}
  .btn-save{flex:1;padding:10px;background:var(--accent);border:none;border-radius:7px;color:#000;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:opacity .15s}
  .btn-save:hover{opacity:.85}
  .btn-cancel{padding:10px 18px;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-family:'Syne',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s}
  .btn-cancel:hover{border-color:var(--border-hover);color:var(--text)}

  /* ── Pipelines ── */
  .pipeline-section{padding:16px 32px 0;border-bottom:1px solid var(--border)}
  .pipeline-section-label{font-family:'Assistant',sans-serif;font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin-bottom:10px;direction:rtl;text-align:right}
  .pipeline-row{display:flex;flex-direction:column;gap:0;padding-bottom:14px;direction:rtl}
  .pipeline-row::-webkit-scrollbar{display:none}
  .pipeline-card{flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:3px;width:185px;direction:rtl;text-align:right}
  .pipeline-card:hover{border-color:var(--border-hover);transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .pipeline-card.active{border-color:var(--lime);background:rgba(163,230,53,.06)}
  .pipeline-emoji{font-size:18px;line-height:1}
  .pipeline-name{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:var(--text);margin-top:2px}
  .pipeline-desc{font-size:13px;color:#b0b8c4;font-family:'Assistant',sans-serif;line-height:1.4}
  .pipeline-count{font-family:'Assistant',sans-serif;font-size:11px;font-weight:600;color:var(--lime);margin-top:3px}
  .pipeline-group{margin-bottom:4px}
  .pipeline-group-header{display:flex;align-items:center;gap:6px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted);margin-bottom:8px;direction:rtl;text-align:right;padding:0 4px}
  .pipeline-group-emoji{font-size:14px}
  .pipeline-group-label{color:var(--accent);font-size:12px}
  .pipeline-group-desc{color:#666;font-size:10px;font-family:'Assistant',sans-serif;font-weight:400}
  .pipeline-group+.pipeline-group{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}

  .pipeline-banner{display:flex;align-items:center;gap:10px;background:rgba(163,230,53,.05);border:1px solid rgba(163,230,53,.18);border-radius:8px;padding:9px 14px;margin-bottom:18px;direction:rtl}
  .pipeline-banner-name{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:var(--lime);flex:1;direction:rtl}
  .pipeline-banner-clear{background:none;border:1px solid rgba(163,230,53,.25);color:var(--lime);border-radius:5px;padding:3px 10px;font-size:12px;cursor:pointer;font-family:'Assistant',sans-serif;font-weight:600;transition:all .15s;white-space:nowrap}
  .pipeline-banner-clear:hover{background:rgba(163,230,53,.1)}

  .step-num-badge{font-family:'Assistant',sans-serif;font-size:13px;font-weight:700;color:var(--lime);background:rgba(163,230,53,.1);border:1px solid rgba(163,230,53,.2);border-radius:4px;padding:3px 10px;display:inline-block;direction:rtl;text-align:right;margin-bottom:4px;white-space:nowrap}

  @media(max-width:700px){
    .shell{flex-direction:column;height:auto;overflow:auto}
    aside{width:100%;height:auto;border-right:none;border-bottom:1px solid var(--border)}
    .cat-nav{display:flex;flex-wrap:wrap;gap:4px;padding:10px}
    .cat-nav-label{display:none}
    .cat-btn{width:auto;flex-shrink:0;font-size:12px;padding:5px 10px}
    .cat-count{display:none}
    main{overflow-y:visible}
    .main-header{position:static}
    .grid-area{padding:16px}
    .drawer{width:100vw}
  }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="logo-area">
      <div class="logo-title">Yaroni Skills</div>
      <div class="logo-sub">claude code · command ref</div>
    </div>
    <div class="sidebar-search">

    {
    cmd:'remotion-best-practices', cat:'build', uc:['content','design'],
    triggers:['תיצור ריל','תערוך סרטון','תיצור סטורי','תיצור אנימציה','תיצור וידאו','remotion'],
    desc:'יוצר ועורך סרטונים ואנימציות בעזרת Remotion — ספריית וידאו ב-React. תמיכה בכתוביות, מעברים, גרפים, ריל, סטורי, פתיחות ליוטיוב',
    detail:'יוצר ועורך סרטונים ואנימציות בקוד React עם Remotion.\n\nדוגמאות לפרומפטים:\n\nעריכת ריל מסרטון מצולם:\n\"יש לי סרטון שצילמתי בתיקייה על שולחן העבודה בשם \'פרויקט ריל\'. תערוך אותו עם Remotion — תחתוך את הקטעים השקטים, תעשה זום אין לקטעים שבהם אני מדבר למצלמה, תוסיף כתוביות אנימטיביות בעברית עם פונט Rubik, תוסיף אנימציות B-roll בסגנון עתידני בין חלקי הסרטון, תשים מוזיקת רקע עדינה, ובסוף תוסיף מסך סיום עם הטקסט \'עקבו אחריי לעוד טיפים\' שנכנס בפייד עם אפקט זוהר. הפורמט 9:16 לריל, 30 שניות.\"\n\nעריכת סרטון מצולם עם כתוביות ואפקטים:\n\"קחו את הסרטון שנמצא בתיקיית הפרויקט. תחתכו את כל הקטעים השקטים שבהם אני לא מדבר, תעשו זום אין עדין לקלוז-אפ בקטעים שבהם אני מדבר ישירות למצלמה, תוסיפו כתוביות בעברית לפי מה שנאמר עם רקע שקוף חלקית מתחת לכל כתובית, הכתוביות נכנסות בפייד ויוצאות בפייד. תוסיפו מעברים חלקים בין הקטעים עם אפקט crossfade. פונט Rubik, גודל 48, צבע לבן. הפורמט 9:16.\"\n\nריל אנימציה לאינסטגרם (בלי צילום):\n\"תיצרו ריל לאינסטגרם, 9:16, 15 שניות. רקע כהה עם גרדיאנט כחול-סגול שזז לאט. כותרת גדולה שנכנסת מלמעלה עם אנימציית spring ורעידה קלה כשהיא נוחתת, ואז 3 נקודות שנכנסות אחת אחרי השנייה מצד ימין עם אייקון קטן ליד כל אחת. פונט Rubik לעברית, גודל 42. אחרי 2 שניות של תצוגה מלאה, הכל יוצא בפייד ומסך סיום נכנס עם הטקסט \'עקבו לעוד טיפים\' שמהבהב פעמיים.\"\n\nסרטון נתונים / אינפוגרפיקה:\n\"תיצרו אנימציה של גרף עמודות שמראה צמיחה חודשית. הנתונים: ינואר 1,200, פברואר 1,800, מרץ 3,400, אפריל 5,200. העמודות עולות אחת אחרי השנייה עם אנימציית spring. מעל כל עמודה מופיע המספר שסופר מאפס עד הערך הסופי. כותרת למעלה \'הצמיחה שלנו ב-2026\' עם קו תחתון מונפש. צבע ראשי כחול, רקע כהה עם טקסטורה עדינה. 10 שניות, 16:9.\"\n\nפתיחה / אאוטרו לסרטוני יוטיוב:\n\"תיצרו אנימציית פתיחה של 5 שניות ליוטיוב. הלוגו שלי נמצא בתיקיית הפרויקט. הוא נכנס מהמרכז עם אפקט scale up + פייד וזוהר עדין סביב הלוגו. אחרי שנייה שם הערוץ מופיע מתחת בטיפוגרפיה אנימטיבית אות-אות, ואז תת-כותרת קטנה \'כל מה שצריך לדעת על AI\' שנכנסת מלמטה. רקע שחור עם חלקיקים זוהרים שזורמים לאט. 16:9, 1080p.\"\n\nסטורי עם טקסט מונפש:\n\"תיצרו סטורי לאינסטגרם, 9:16, 8 שניות. רקע גרדיאנט ורוד-סגול שנושם לאט (מתכהה ומתבהר). 4 שורות טקסט שנכנסות אחת אחרי השנייה מצד ימין עם spring ורעידה קלה: שורה 1 \'AI לא הולך לקחת לכם את העבודה\', שורה 2 \'אנשים שיודעים להשתמש ב-AI\', שורה 3 \'הולכים לקחת לכם את העבודה\'. אחרי חצי שנייה של השהייה, שורה 4 גדולה פי 2 ובולד נכנסת מהמרכז עם אפקט פיצוץ קל. פונט Rubik.\"\n\nהפיכת נתונים מקובץ לסרטון אנימציה:\n\"יש לי קובץ PDF עם דוח מכירות רבעוני בתיקיית הפרויקט, וגם טבלת אקסל עם נתוני הכנסות חודשיות. תחלץ את הנתונים החשובים משני הקבצים ותיצור סרטון אנימציה שמציג אותם בצורה ויזואלית. תתחיל עם כותרת \'סיכום רבעון 1\' שנכנסת עם spring, אחר כך גרף עמודות שמראה את ההכנסות חודש-חודש עם מספרים שסופרים למעלה, ואז פאי צ\'ארט שמראה חלוקה לפי קטגוריות. בסוף מסך סיום עם האחוז הכולל של צמיחה שמופיע בגדול עם אפקט זוהר. רקע כהה, צבעים כחול וירוק, פונט אריאל, 20 שניות, 16:9.\"\n\nפורמטים: 9:16 ריל/סטורי | 16:9 יוטיוב | 1:1 אינסטגרם',
    steps:[

let skills=DEFAULT_SKILLS, activeCat='all', activeUC='all', activePipeline=null, query='';

function getFiltered(){
  function normalize(str){
    // מסיר אות א מתוך מילים (לינקדאין→לינקדין, אינסטגרם→אינסטגרם)
    // ומאחד ו/ואו, י/יי וכו' לצורך חיפוש סלחני
    return str.toLowerCase().replace(/(?<=[א-ת])א(?=[א-ת])/g,'');
  }
  function matchesQuery(s,q){
    if(!q)return true;
    const nq=normalize(q);
    const fields=[s.cmd,s.desc,s.detail||'',...(s.triggers||[]),...(s.next||[]).map(n=>n.label+' '+n.hint)];
    return fields.some(f=>normalize(f).includes(nq));
  }
  if(activePipeline){
    const q=query.toLowerCase();
    return activePipeline.skills
      .map(ps=>skills.find(s=>s.cmd===ps.cmd))
      .filter(s=>s&&matchesQuery(s,q));
  }
  return skills.filter(s=>{
    const mc=activeCat==='all'||s.cat===activeCat;
    const mu=activeUC==='all'||(s.uc&&s.uc.includes(activeUC));
    const q=query.toLowerCase();
    return mc&&mu&&matchesQuery(s,q);
  });
}

function buildCard(s,stepNum,stepLabel,pipelineSkill){
  const color=CAT_COLORS[s.cat]||'#555';
  const card=document.createElement('div');
  card.className='skill-card';
  card.dataset.cat=s.cat;

  const id='c'+Math.random().toString(36).slice(2,8);
  card.id=id;
  const st=document.createElement('style');
  st.textContent='#'+id+'::before{background:'+color+'}';
  document.head.appendChild(st);

  // top row
  const top=document.createElement('div');top.className='card-top';
  const pill=document.createElement('div');pill.className='cmd-pill';
  const ci=document.createElement('i');ci.dataset.lucide='copy';ci.className='copy-icon';
  pill.appendChild(ci);pill.appendChild(document.createTextNode(s.cmd));
  const tag=document.createElement('span');tag.className='cat-tag';
  tag.style.background=color+'22';tag.style.color=color;
  tag.textContent=CAT_LABELS[s.cat]||s.cat;
  top.appendChild(pill);top.appendChild(tag);

  const desc=document.createElement('div');desc.className='card-desc';desc.textContent=s.desc;

  // pipeline context short line
  if(pipelineSkill&&pipelineSkill.context){
    const ctx=document.createElement('div');ctx.className='card-context-short';
    ctx.textContent=pipelineSkill.context.short;
    card.appendChild(top);card.appendChild(desc);card.appendChild(ctx);
  } else {
    card.appendChild(top);card.appendChild(desc);
  }

  const hint=document.createElement('div');hint.className='card-hint';
  const isSlash=s.cmd.startsWith('/');
  const badge=document.createElement('span');
  badge.className='trigger-badge '+(isSlash?'trigger-slash':'trigger-auto');
  badge.textContent=isSlash?'/ פקודה':'⚡ אוטומטי';
  const hi=document.createElement('i');hi.dataset.lucide='info';hi.style.width='10px';hi.style.height='10px';hi.style.marginRight='2px';
  hint.appendChild(badge);hint.appendChild(hi);hint.appendChild(document.createTextNode(' לחץ לפרטים'));
  card.appendChild(hint);

  if(stepNum){
    const sn=document.createElement('div');sn.className='step-num-badge';
    sn.textContent='שלב '+stepNum+(stepLabel?' · '+stepLabel:'');
    card.insertBefore(sn,card.firstChild);
  }

  pill.addEventListener('click',e=>{e.stopPropagation();copyCmd(s.cmd);});
  card.addEventListener('click',()=>openDrawer(s,pipelineSkill));
  return card;
}

function renderGrid(){
  const filtered=getFiltered();
  document.getElementById('visibleCount').textContent=filtered.length;
  const area=document.getElementById('gridArea');
  while(area.firstChild)area.removeChild(area.firstChild);

  if(!filtered.length){
    const e=document.createElement('div');e.className='empty';e.textContent='לא נמצאו סקילים · try a different search';
    area.appendChild(e);return;
  }

  if(activePipeline){
    const banner=document.createElement('div');banner.className='pipeline-banner';
    const bname=document.createElement('span');bname.className='pipeline-banner-name';
    bname.textContent=activePipeline.emoji+' '+activePipeline.name+' — '+activePipeline.desc;
    const bclear=document.createElement('button');bclear.className='pipeline-banner-clear';bclear.textContent='× נקה';
    bclear.addEventListener('click',clearPipeline);
    banner.appendChild(bname);banner.appendChild(bclear);
    area.appendChild(banner);
    if(activePipeline.sessions){
      activePipeline.sessions.forEach(session=>{
        const sessionHdr=document.createElement('div');
        sessionHdr.style.cssText='color:#C5F206;font-size:13px;font-weight:600;margin:16px 0 8px;padding:6px 12px;background:rgba(197,242,6,0.08);border-radius:6px;border-right:3px solid #C5F206;';
        sessionHdr.textContent=session.name;
        area.appendChild(sessionHdr);
        const grid=document.createElement('div');grid.className='cards-grid';
        session.skills.forEach((ps,i)=>{
          const s=DEFAULT_SKILLS.find(x=>x.cmd===ps.cmd);
          if(s)grid.appendChild(buildCard(s,i+1,ps.stepLabel,ps));
        });
        area.appendChild(grid);
      });
    } else {
      const grid=document.createElement('div');grid.className='cards-grid';
      filtered.forEach((s,i)=>{
        const ps=activePipeline.skills.find(p=>p.cmd===s.cmd);
        grid.appendChild(buildCard(s,i+1,ps?ps.stepLabel:'',ps));
      });
      area.appendChild(grid);
    }
  } else {
    const groups={};
    filtered.forEach(s=>{if(!groups[s.cat])groups[s.cat]=[];groups[s.cat].push(s);});
    CAT_ORDER.forEach(cat=>{
      if(!groups[cat])return;
      const lbl=document.createElement('div');lbl.className='section-label';lbl.textContent=CAT_LABELS[cat]||cat;
      area.appendChild(lbl);
      const grid=document.createElement('div');grid.className='cards-grid';
      groups[cat].forEach(s=>grid.appendChild(buildCard(s)));
      area.appendChild(grid);
    });
  }
  lucide.createIcons();
}

function clearPipeline(){
  activePipeline=null;
  document.querySelectorAll('.pipeline-card').forEach(c=>c.classList.remove('active'));
  document.getElementById('mainTitle').textContent='כל הסקילים';
  renderGrid();
}

function updateCounts(){
  document.getElementById('count-all').textContent=skills.length;
  CAT_ORDER.forEach(cat=>{const el=document.getElementById('count-'+cat);if(el)el.textContent=skills.filter(s=>s.cat===cat).length;});
}

// ── Drawer ────────────────────────────────────────────────────────────────
function openDrawer(s,pipelineSkill){
  const color=CAT_COLORS[s.cat]||'#555';
  document.getElementById('drawerBar').style.background=color;
  document.getElementById('drawerCmd').textContent=s.cmd;
  document.getElementById('drawerCmd').style.color=color;

  const body=document.getElementById('drawerBody');
  while(body.firstChild)body.removeChild(body.firstChild);

  // tag + short desc
  const tag=document.createElement('span');tag.className='drawer-tag';
  tag.style.background=color+'22';tag.style.color=color;
  tag.textContent=CAT_LABELS[s.cat]||s.cat;
  body.appendChild(tag);

  const shortDesc=document.createElement('div');shortDesc.className='drawer-short';shortDesc.textContent=s.desc;
  body.appendChild(shortDesc);

  // pipeline context — timeline flow
  if(pipelineSkill&&pipelineSkill.context){
    const ctx=pipelineSkill.context;
    const isSlash=s.cmd.startsWith('/');
    const isMCP=s.cmd.startsWith('MCP ·');
    const tl=document.createElement('div');tl.className='steps-timeline';

    function mkStep(label,contentFn){
      const step=document.createElement('div');step.className='timeline-step';
      const left=document.createElement('div');left.className='timeline-left';
      const dot=document.createElement('div');dot.className='timeline-dot';
      const conn=document.createElement('div');conn.className='timeline-connector';
      left.appendChild(dot);left.appendChild(conn);
      const content=document.createElement('div');content.className='timeline-content';
      const lbl=document.createElement('div');lbl.className='timeline-label';lbl.textContent=label;
      content.appendChild(lbl);
      contentFn(content);
      step.appendChild(left);step.appendChild(content);
      return step;
    }

    // Step 1 — Activation
    tl.appendChild(mkStep('① הפעלה — מה להקליד',c=>{
      const inv=document.createElement('div');inv.className='timeline-invoke';
      inv.textContent=isMCP?'פועל אוטומטית בשיחה — אין פקודה':isSlash?s.cmd:s.cmd;
      inv.title='לחץ להעתקה';
      if(!isMCP)inv.addEventListener('click',()=>copyCmd(s.cmd));
      c.appendChild(inv);
    }));

    // Step 2 — What to write
    tl.appendChild(mkStep('② מה לכתוב ל-Claude',c=>{
      const t=document.createElement('div');t.className='timeline-example';t.textContent=ctx.howto;
      c.appendChild(t);
    }));

    // Step 3 — What Claude asks
    tl.appendChild(mkStep('③ Claude ישאל אותך',c=>{
      const t=document.createElement('div');t.className='timeline-asks';t.textContent=ctx.expect;
      c.appendChild(t);
    }));

    // Step 4 — What you get
    tl.appendChild(mkStep('④ מה מקבלים',c=>{
      const t=document.createElement('div');t.className='timeline-result';t.textContent=ctx.what;
      c.appendChild(t);
    }));

    body.appendChild(tl);
  }

  // detail
  if(s.detail){
    const sec=document.createElement('div');sec.className='detail-section';
    const lbl=document.createElement('div');lbl.className='detail-section-label';lbl.textContent='מה זה עושה בפועל';
    const txt=document.createElement('div');txt.className='detail-text';txt.textContent=s.detail;
    sec.appendChild(lbl);sec.appendChild(txt);body.appendChild(sec);
  }

  // steps
  if(s.steps&&s.steps.length){
    const exBox=document.createElement('div');exBox.className='example-box';
    const exLbl=document.createElement('div');exLbl.className='example-label';exLbl.textContent='איך משתמשים — צעד אחר צעד';
    exBox.appendChild(exLbl);
    s.steps.forEach((step,i)=>{
      const row=document.createElement('div');row.className='example-step';
      const num=document.createElement('div');num.className='step-num';num.textContent=(i+1)+'.';
      const content=document.createElement('div');
      const t=document.createElement('div');t.className='step-text';t.textContent=step.t;
      content.appendChild(t);
      if(step.c){
        const code=document.createElement('div');code.className='step-code';code.textContent=step.c;
        content.appendChild(code);
      }
      row.appendChild(num);row.appendChild(content);
      exBox.appendChild(row);
    });
    body.appendChild(exBox);
  }

  // copy button
  if(s.cmd.startsWith('MCP ·')){
    const mcpNote=document.createElement('div');mcpNote.className='copy-cmd-btn';mcpNote.style.cursor='default';
    mcpNote.textContent='מופעל אוטומטית בשיחה — אין צורך בפקודה';
    body.appendChild(mcpNote);
  } else {
    const copyBtn=document.createElement('button');copyBtn.className='copy-cmd-btn';
    const cIcon=document.createElement('i');cIcon.dataset.lucide='copy';cIcon.style.width='14px';cIcon.style.height='14px';
    copyBtn.appendChild(cIcon);
    if(s.cmd.startsWith('/')){
      copyBtn.appendChild(document.createTextNode(' העתק פקודה: '+s.cmd));
      copyBtn.addEventListener('click',()=>copyCmd(s.cmd));
    } else {
      const usageToCopy=(s.usage||'').replace(/^["']|["']$/g,'');
      copyBtn.appendChild(document.createTextNode(' העתק דוגמה לשימוש'));
      copyBtn.addEventListener('click',()=>copyCmd(usageToCopy));
    }
    body.appendChild(copyBtn);
  }

  // Next steps section
  if(s.next&&s.next.length>0){
    const nsec=document.createElement('div');nsec.className='next-section';
    const nlbl=document.createElement('div');nlbl.className='next-section-label';nlbl.textContent='מה עושים עם התוצאה';
    nsec.appendChild(nlbl);
    s.next.forEach(n=>{
      const btn=document.createElement('button');btn.className='next-btn';
      const em=document.createElement('span');em.className='next-btn-emoji';em.textContent=n.emoji;
      const info=document.createElement('div');info.style.flex='1';
      const lbl=document.createElement('div');lbl.className='next-btn-label';lbl.textContent=n.label;
      const hint=document.createElement('div');hint.className='next-btn-hint';hint.textContent=n.hint;
      const tag=document.createElement('span');tag.className='next-btn-copy';tag.textContent='העתק + סגור';
      info.appendChild(lbl);info.appendChild(hint);
      btn.appendChild(em);btn.appendChild(info);btn.appendChild(tag);
      btn.addEventListener('click',()=>{
        navigator.clipboard.writeText(n.prompt).catch(()=>{
          const ta=document.createElement('textarea');ta.value=n.prompt;
          document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
        });
        closeDrawer();
        const t=document.getElementById('toast');t.textContent='✓ הועתק — הדבק ב-Claude Code';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);
      });
      nsec.appendChild(btn);
    });
    body.appendChild(nsec);
  }

  // Triggers section
  if(s.triggers&&s.triggers.length>0){
    const tsec=document.createElement('div');tsec.className='triggers-section';
    const tlbl=document.createElement('div');tlbl.className='triggers-label';tlbl.textContent='טריגרים';
    const tlist=document.createElement('div');tlist.className='triggers-list';
    s.triggers.forEach(tr=>{
      const chip=document.createElement('span');
      chip.className='trigger-chip'+(tr==='פקודה ידנית'?' manual':'');
      chip.textContent=tr;
      tlist.appendChild(chip);
    });
    tsec.appendChild(tlbl);tsec.appendChild(tlist);
    body.appendChild(tsec);
  }

  lucide.createIcons();
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer(){
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

document.getElementById('closeDrawer').addEventListener('click',closeDrawer);
document.getElementById('drawerOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('drawerOverlay'))closeDrawer();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

// ── Copy ──────────────────────────────────────────────────────────────────
function copyCmd(text){
  navigator.clipboard.writeText(text).then(()=>{
    const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);
  });
}

// ── Category nav ──────────────────────────────────────────────────────────
document.querySelectorAll('.cat-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');activeCat=btn.dataset.cat;
    const titles={all:'כל הסקילים',...CAT_LABELS};
    document.getElementById('mainTitle').textContent=titles[activeCat]||activeCat;
    renderGrid();
  });
});

document.querySelectorAll('.uc-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.uc-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');activeUC=btn.dataset.uc;
    renderGrid();
  });
});

document.getElementById('searchInput').addEventListener('input',e=>{query=e.target.value;renderGrid();});


// ── Pipelines ──────────────────────────────────────────────────────────────
function initPipelines(){
  const row=document.getElementById('pipelineRow');
  Object.entries(PIPELINE_GROUPS).forEach(([gid,g])=>{
    const grp=document.createElement('div');grp.className='pipeline-group';
    const hdr=document.createElement('div');hdr.className='pipeline-group-header';
    const em=document.createElement('span');em.className='pipeline-group-emoji';em.textContent=g.emoji;
    const lbl=document.createElement('span');lbl.className='pipeline-group-label';lbl.textContent=g.label;
    const dsc=document.createElement('span');dsc.className='pipeline-group-desc';dsc.textContent=' — '+g.desc;
    hdr.appendChild(em);hdr.appendChild(lbl);hdr.appendChild(dsc);
    grp.appendChild(hdr);
    const cards=document.createElement('div');cards.style.cssText='display:flex;gap:10px;flex-wrap:wrap';
    PIPELINES.filter(p=>p.group===gid).forEach(p=>{
      const card=document.createElement('div');card.className='pipeline-card';card.dataset.id=p.id;
      const emoji=document.createElement('div');emoji.className='pipeline-emoji';emoji.textContent=p.emoji;
      const name=document.createElement('div');name.className='pipeline-name';name.textContent=p.name;
      const desc=document.createElement('div');desc.className='pipeline-desc';desc.textContent=p.desc;
      const count=document.createElement('div');count.className='pipeline-count';const totalSteps=p.sessions?p.sessions.reduce((a,s)=>a+s.skills.length,0):p.skills.length;count.textContent=totalSteps+' שלבים';
      card.appendChild(emoji);card.appendChild(name);card.appendChild(desc);card.appendChild(count);
      card.addEventListener('click',()=>{
        if(activePipeline&&activePipeline.id===p.id){clearPipeline();return;}
        activePipeline=p;
        document.querySelectorAll('.pipeline-card').forEach(c=>c.classList.remove('active'));
        card.classList.add('active');
        document.getElementById('mainTitle').textContent=p.emoji+' '+p.name;
        renderGrid();
      });
      cards.appendChild(card);
    });
    grp.appendChild(cards);
    row.appendChild(grp);
  });
}

// ── Init ──────────────────────────────────────────────────────────────────
lucide.createIcons();updateCounts();initPipelines();renderGrid();
</script>
</body>
</html>
